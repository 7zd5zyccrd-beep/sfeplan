<title>SF E-Plan</title>
<style>
  :root{
    --ink:#1B2430;          /* Schrift und Linien */
    --ink-leise:#6A7480;
    --grund:#FFFFFF;
    --flaeche:#F2F4F5;
    --linie:#DCE1E4;
    --akzent:#17726B;       /* gedämpftes Blaugrün, steht nicht in Konkurrenz zu den Planfarben */
    --akzent-hell:#E3EFED;
    --warn:#A3342B;
    --radius:14px;
    --kopf:56px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* Kein Markieren beim langen Drücken; Eingabefelder bleiben ausgenommen. */
  /* touch-action:manipulation nimmt Safari das Doppeltippen zum Zoomen weg.
     Zwei schnelle Tipps auf denselben Knopf – etwa auf die Pfeile im
     Sortiermodus – zogen sonst die ganze Seite auf, und danach lagen alle
     Knöpfe neben ihrer sichtbaren Stelle. Die Leinwand bleibt bei
     touch-action:none, sie führt ihre Gesten selbst. */
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
       touch-action:manipulation}
  input,textarea,select,.fenster p{-webkit-user-select:text;user-select:text}
  /* Kein overflow:hidden auf Wurzel und Rumpf. Es war in v1.49 als
     zweiter Riegel gegen die Scroll-Verkettung gedacht, hat aber unter
     iOS die zugeteilte Ansicht um 68 Punkte verkürzt: eine Seite, die
     grundsätzlich nicht scrollen kann, bekommt vom System weniger
     Fläche, und der Rest bleibt weiß und unbemalbar. Gegen die
     Verkettung reichen overscroll-behavior in den scrollenden Kästen
     und der Wächter in Abschnitt 15. */
  html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
  /* Die Bildschirme decken selbst ab, statt den Grund durchscheinen zu
     lassen – aufgefallen bei der Farbprobe in v1.52. */
  .schirm{background:var(--grund)}
  body{
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--grund);
    -webkit-text-size-adjust:100%;
  }
  button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
  button:focus-visible{outline:2px solid var(--akzent);outline-offset:2px;border-radius:6px}

  /* ---------- Grundgerüst ---------- */
  /* Fest am Bildschirm statt an einer Höhenangabe: 100dvh liefert auf
     manchen Geräten einen Rest, der als weißer Streifen stehen bleibt.
     inset:0 allein genügt aber nicht – es hängt an dem Bereich, den die
     Seite für den Bildschirm hält, und der ist auf manchen Geräten
     kürzer als das, was zu sehen ist. Die Höhe kommt deshalb aus
     --sicht, gesetzt aus dem Sichtfenster (Abschnitt 16). Solange die
     nicht steht, gilt die volle Höhe wie bisher. */
  .schirm{display:none;flex-direction:column;position:fixed;inset:0;
          height:var(--sicht,100%);overflow:hidden}
  .schirm.an{display:flex}

  .kopf{
    height:var(--kopf);flex:0 0 auto;display:flex;align-items:center;gap:8px;
    padding:0 12px;border-bottom:1px solid var(--linie);
    padding-top:env(safe-area-inset-top);height:calc(var(--kopf) + env(safe-area-inset-top));
    background:var(--grund);
  }
  .kopf .titel{flex:1;text-align:center;font-weight:600;font-size:17px;
               white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kopf button{width:40px;height:40px;display:flex;align-items:center;justify-content:center;
               font-size:22px;color:var(--ink);flex:0 0 auto}
  .kopf .platz{width:40px}

  .rumpf{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;
         -webkit-overflow-scrolling:touch}
  .innen{max-width:760px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}

  h2{font-size:15px;font-weight:600;margin:22px 0 8px;color:var(--ink-leise)}
  p{margin:0 0 10px}
  .leise{color:var(--ink-leise);font-size:14px}

  .knopf{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--akzent);color:#fff;font-weight:600;
    padding:14px 20px;border-radius:var(--radius);width:100%;
  }
  .knopf:active{opacity:.85}
  .knopf.leer{background:transparent;color:var(--ink);border:1px solid var(--linie);font-weight:500}
  .knopf.gefahr{background:transparent;color:var(--warn);border:1px solid var(--linie);font-weight:500}
  .knopf[disabled]{opacity:.45}

  /* ---------- Planliste ---------- */
  .karte{
    border:1px solid var(--linie);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;
  }
  .karte .text{flex:1;min-width:0}
  .karte .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .karte .unter{font-size:13px;color:var(--ink-leise);margin-top:2px}
  .karte .mehr{width:36px;height:36px;flex:0 0 auto;display:flex;align-items:center;
               justify-content:center;font-size:20px;color:var(--ink-leise);border-radius:10px}
  .karte .mehr:active{background:var(--flaeche)}
  .leerhinweis{
    border:1px dashed var(--linie);border-radius:var(--radius);
    padding:28px 18px;text-align:center;color:var(--ink-leise);margin-bottom:16px;
  }
  .punkte{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}

  /* ---------- Planansicht ---------- */
  #leinwandRahmen{flex:1;min-height:0;position:relative;background:#fff;overflow:hidden}
  #leinwand{display:block;width:100%;height:100%;touch-action:none}
  #oberflaeche{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .fuss{
    flex:0 0 auto;display:flex;gap:6px;padding:8px 10px;
    padding-bottom:calc(8px + env(safe-area-inset-bottom));
    border-top:1px solid var(--linie);background:var(--grund);
    overflow-x:auto;overscroll-behavior:contain;
  }
  /* Leisten der Betriebsarten liegen über der Zeichnung, statt Platz zu nehmen. */
  .fuss.schwebend{
    position:absolute;z-index:6;left:10px;right:10px;
    bottom:calc(10px + env(safe-area-inset-bottom));
    border:1px solid var(--linie);border-radius:var(--radius);
    padding:8px;background:rgba(255,255,255,.94);
    box-shadow:0 6px 20px rgba(27,36,48,.18);
    justify-content:center;
  }
  @supports (backdrop-filter: blur(6px)){
    .fuss.schwebend{background:rgba(255,255,255,.82);backdrop-filter:blur(6px)}
  }
  .fuss button{
    flex:0 0 auto;padding:9px 13px;border-radius:11px;font-size:14px;
    border:1px solid var(--linie);color:var(--ink-leise);white-space:nowrap;
  }
  /* Schwebende Knöpfe auf der Zeichnung */
  .schwebknopf{
    position:absolute;z-index:6;width:44px;height:44px;border-radius:22px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.92);color:var(--ink);
    border:1px solid var(--linie);box-shadow:0 4px 14px rgba(27,36,48,.20);
  }
  .schwebknopf:active{background:var(--flaeche)}
  .schwebknopf[hidden]{display:none}
  @supports (backdrop-filter: blur(6px)){
    .schwebknopf{background:rgba(255,255,255,.78);backdrop-filter:blur(6px)}
  }
  #knopfZurueck{top:calc(12px + env(safe-area-inset-top));left:12px}
  #knopfMenue{top:calc(12px + env(safe-area-inset-top));right:12px}
  #knopfSuche{bottom:calc(12px + env(safe-area-inset-bottom));right:12px}

  #streifen{
    position:absolute;z-index:5;
    top:calc(14px + env(safe-area-inset-top));left:66px;right:66px;
    padding:9px 12px;border-radius:12px;
    background:rgba(23,114,107,.94);color:#fff;font-size:13px;
    line-height:1.35;text-align:center;
  }
  .fuss[hidden]{display:none}
  .fuss button[disabled]{opacity:.4}
  .fuss button.an{background:var(--akzent-hell);border-color:var(--akzent);color:var(--akzent);font-weight:600}

  /* ---------- Schaltbild ---------- */
  #sbRahmen{flex:1;min-height:0;width:100%;border:0;background:#fff}
  .sbleiste{
    flex:0 0 auto;display:flex;gap:8px;padding:10px 12px;
    padding-bottom:calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--linie);background:var(--grund);
  }
  .sbleiste .knopf{width:auto;flex:1;padding:12px 14px}

  /* ---------- Werkzeuge ---------- */
  #menueSchleier{
    position:fixed;inset:0;height:var(--sicht,100%);
    background:rgba(27,36,48,.35);z-index:46;
    display:flex;align-items:flex-end;justify-content:center;
  }
  #menueSchleier[hidden]{display:none}
  #menueBlatt{
    width:100%;max-width:520px;background:var(--grund);
    border-radius:20px 20px 0 0;padding:8px 14px calc(18px + env(safe-area-inset-bottom));
    max-height:80vh;overflow:auto;overscroll-behavior:contain;
  }
  .griff{width:38px;height:4px;border-radius:2px;background:var(--linie);margin:4px auto 12px}
  #menueInhalt .zeile{margin-bottom:8px}
  .schalterwert{font-size:13px;font-weight:600;color:var(--ink-leise);flex:0 0 auto}
  .schalterwert.an{color:var(--akzent)}

  /* ---------- Suche ---------- */
  #suchschirm{
    position:fixed;inset:0;height:var(--sicht,100%);
    background:var(--grund);z-index:45;
    display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top);
  }
  #suchschirm[hidden]{display:none}
  .suchkopf{
    display:flex;gap:8px;align-items:center;padding:10px 12px;
    border-bottom:1px solid var(--linie);flex:0 0 auto;
  }
  .suchkopf input{
    flex:1;min-width:0;padding:12px 14px;border:1px solid var(--linie);
    border-radius:var(--radius);font:inherit;color:var(--ink);
  }
  .suchkopf input:focus{outline:none;border-color:var(--akzent)}
  .suchkopf button{padding:12px 6px;color:var(--akzent);font-weight:600;flex:0 0 auto}
  .suchliste{flex:1;overflow:auto;overscroll-behavior:contain;
             padding:12px 12px calc(24px + env(safe-area-inset-bottom))}
  .suchliste .zeile{max-width:760px;margin-left:auto;margin-right:auto}
  .marke{
    flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:.04em;
    padding:4px 7px;border-radius:7px;background:var(--flaeche);color:var(--ink-leise);
  }
  .marke.uv{background:var(--akzent-hell);color:var(--akzent)}

  /* ---------- eigene Abfragefenster ---------- */
  /* Der Schleier scrollt selbst, wenn das Fenster höher wird als der
     Bildschirm. Zentriert wird nicht am Schleier, sondern in einem
     Kasten darin, der mindestens die volle Höhe hat und mit dem Inhalt
     mitwächst: So steht das Fenster mittig, solange es passt, und ragt
     doch nie oben aus dem scrollbaren Bereich heraus. */
  #schleier{
    position:fixed;inset:0;height:var(--sicht,100%);
    background:rgba(27,36,48,.45);
    display:none;padding:20px;z-index:50;
    overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  }
  #schleier.an{display:block}
  #schleier .mitte{
    min-height:100%;display:flex;align-items:center;justify-content:center;
  }
  .fenster{
    background:var(--grund);border-radius:18px;padding:20px;margin:0 auto;
    width:100%;max-width:380px;box-shadow:0 12px 40px rgba(27,36,48,.28);
  }
  .fenster h3{margin:0 0 8px;font-size:17px}
  .fenster p{font-size:15px;color:var(--ink-leise)}
  .fenster input{
    width:100%;padding:12px 14px;border:1px solid var(--linie);border-radius:var(--radius);
    font:inherit;color:var(--ink);margin:6px 0 4px;
  }
  .fenster input:focus{outline:none;border-color:var(--akzent)}
  .fensterknoepfe{display:flex;flex-direction:column;gap:8px;margin-top:16px}
  .zeile{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    border:1px solid var(--linie);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:8px;background:var(--grund);
  }
  .zeile:active{background:var(--flaeche)}
  .zeile .nr{
    flex:0 0 auto;min-width:30px;height:30px;padding:0 6px;border-radius:9px;
    background:var(--akzent-hell);color:var(--akzent);font-weight:700;font-size:13px;
    display:flex;align-items:center;justify-content:center;
  }
  .zeile .haupt{flex:1;min-width:0}
  /* display:block, sonst laufen beide Zeilen ineinander und die
     Kürzung mit Auslassungspunkten greift nicht. */
  .zeile .oben{display:block;font-weight:600;
               white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .zeile .unten{display:block;font-size:13px;color:var(--ink-leise);margin-top:2px}
  .zeile .pfeil{color:var(--ink-leise);font-size:18px;flex:0 0 auto}
  .zeile .sortier{display:flex;gap:8px;flex:0 0 auto}
  .pfeilknopf{
    width:42px;height:42px;flex:0 0 auto;border:1px solid var(--linie);
    border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:14px;color:var(--ink);background:var(--grund);
  }
  .pfeilknopf:active{background:var(--flaeche)}
  .pfeilknopf:disabled{opacity:.25}
  .platzhalter{color:var(--ink-leise);font-size:14px;padding:6px 2px 12px}
  /* Gliederung langer Listen: Zwischenüberschrift, eingerückte Gruppe
     mit Linie links (das Gegenstück zur Untersammelschiene im
     Schaltbild) und ein leiser Knopf zum Anlegen, der zu dem Abschnitt
     darüber gehört. */
  .unterschrift{font-size:13px;color:var(--ink-leise);margin:16px 0 6px}
  .gruppe{border-left:2px solid var(--linie);padding-left:10px;margin-left:8px}
  .zuknopf{
    display:flex;align-items:center;justify-content:center;width:100%;
    border:1px dashed var(--linie);border-radius:var(--radius);
    padding:10px 14px;margin-bottom:8px;color:var(--ink-leise);font-size:14px;
  }
  .zuknopf:active{background:var(--flaeche)}
  .hakenzeile{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    border:1px solid var(--linie);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:8px;background:var(--grund);
  }
  .hakenzeile:active{background:var(--flaeche)}
  .hakenzeile .haken{
    width:24px;height:24px;flex:0 0 auto;border:2px solid var(--linie);border-radius:7px;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:700;color:transparent;
  }
  .hakenzeile.an .haken{background:var(--akzent);border-color:var(--akzent);color:#fff}
  .hakenzeile .haupt{flex:1;min-width:0}
  .hakenzeile .oben{display:block;font-weight:600}
  .hakenzeile .unten{display:block;font-size:13px;color:var(--ink-leise);margin-top:2px}
  /* Zeigt die inneren Werte, während gearbeitet wird. Nimmt selbst keine
     Tipps an, sonst würde sie genau das verfälschen, was sie messen soll.
     Sie liegt über allem anderen. */
  #zustand{
    position:fixed;z-index:150;pointer-events:none;
    top:calc(62px + env(safe-area-inset-top));left:6px;right:6px;
    background:rgba(27,36,48,.74);color:#EAF0F2;
    padding:7px 9px;border-radius:10px;
    font:9.5px/1.32 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    white-space:pre-wrap;word-break:break-word;
  }
  #zustand[hidden]{display:none}
  #zustand .band{display:block;color:#8FD8D0;margin-top:4px;
                 border-top:1px solid rgba(255,255,255,.18);padding-top:4px}
  .fenster label{display:block;font-size:13px;color:var(--ink-leise);margin:12px 0 2px}
  .fenster select{
    width:100%;padding:12px 14px;border:1px solid var(--linie);border-radius:var(--radius);
    font:inherit;color:var(--ink);background:var(--grund);appearance:none;
  }
  .fenster select:focus{outline:none;border-color:var(--akzent)}
  .farbliste{max-height:46vh;overflow:auto;overscroll-behavior:contain;
             margin-top:10px;border:1px solid var(--linie);border-radius:var(--radius)}
  .farbzeile{
    display:flex;align-items:center;gap:12px;width:100%;
    padding:11px 14px;border-bottom:1px solid var(--linie);text-align:left;
  }
  .farbzeile:last-child{border-bottom:0}
  .farbzeile .probe{width:20px;height:20px;border-radius:50%;flex:0 0 auto;
                    border:1px solid rgba(27,36,48,.25)}
  .farbzeile .anzahl{flex:1;font-size:15px;color:var(--ink-leise)}
  .farbzeile .haken{width:22px;text-align:center;font-weight:700;color:transparent}
  .farbzeile.an .anzahl{color:var(--ink);font-weight:600}
  .farbzeile.an .haken{color:var(--akzent)}

  /* ---------- Fortschritt ---------- */
  #arbeit{
    position:fixed;inset:0;height:var(--sicht,100%);
    background:rgba(255,255,255,.94);z-index:60;
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;
  }
  #arbeit.an{display:flex}
  .rad{width:30px;height:30px;border:3px solid var(--linie);border-top-color:var(--akzent);
       border-radius:50%;animation:dreh .8s linear infinite}
  @keyframes dreh{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){ .rad{animation-duration:2s} }
  #arbeitText{font-size:15px;color:var(--ink-leise);text-align:center}

  .fehler{color:var(--warn);font-size:14px;margin-top:10px}
  input[type=file]{display:none}
</style>
</head>

<script type="module">
"use strict";

const FASSUNG = "v1.53 · 03.09.2026";

/* Ein Fehler in einem Klickhandler bleibt sonst unbemerkt: der Knopf tut
   einfach nichts. Beides – geworfene Fehler und gescheiterte Versprechen –
   wird deshalb festgehalten. Das rote Band am unteren Rand ist entfallen;
   die Meldung steht jetzt in der Zustandsanzeige, in ihrer eigenen Zeile
   und mit Uhrzeit im Band der Ereignisse. Der letzte Fehler bleibt dabei
   erhalten, auch wenn die Anzeige erst später eingeschaltet wird. */
let fehlerZahl = 0, letzterFehler = "";
let zustandBereit = false;      // erst danach lässt sich ins Band schreiben
function fehlerMelden(text){
  fehlerZahl++;
  letzterFehler = String(text).slice(0, 160);
  if (zustandBereit) bandZeile("⚠ " + letzterFehler);
}
window.addEventListener("error", ev => {
  const wo = ev.lineno ? " (Zeile " + ev.lineno + ")" : "";
  fehlerMelden("Fehler: " + (ev.message || "unbekannt") + wo);
});
window.addEventListener("unhandledrejection", ev => {
  const g = ev.reason;
  fehlerMelden("Fehler: " + String((g && (g.stack || g.message)) || g).slice(0, 300));
});

/* ================================================================== */
/* 1 · Kleinkram                                                       */
/* ================================================================== */

const $ = (id) => document.getElementById(id);
const zahl = (n) => Number(n).toLocaleString("de-DE");
const datumText = (t) => new Date(t).toLocaleDateString("de-DE",
  { day:"2-digit", month:"2-digit", year:"numeric" });
const naechsterRahmen = () => new Promise(r => requestAnimationFrame(() => r()));

/* Safari zoomt die Seite auch mit zwei Fingern, unabhängig von
   user-scalable=no. Die Leinwand hat ihre eigene Zoomgeste, die Seite
   selbst soll fest stehen bleiben. */
["gesturestart","gesturechange","gestureend"].forEach(n =>
  document.addEventListener(n, ev => ev.preventDefault(), { passive:false }));

function arbeitAn(text){ $("arbeitText").textContent = text; $("arbeit").classList.add("an"); }
function arbeitAus(){ $("arbeit").classList.remove("an"); }

/* Fenster schließen. Den Versatz, den iOS nach der Tastatur gelegentlich
   stehen lässt, nimmt jetzt der Wächter zurück (Abschnitt 15). */
function fensterZu(){
  $("schleier").classList.remove("an");
  seiteZurueck("Fenster");
}

/* Abfragen laufen über ein eigenes Fenster, nicht über Systemdialoge. */
function frage({ titel, text, felder, knoepfe }){
  return new Promise(fertig => {
    const f = $("fenster");
    f.innerHTML = "";
    if (titel){ const h = document.createElement("h3"); h.textContent = titel; f.appendChild(h); }
    if (text){ const p = document.createElement("p"); p.textContent = text; f.appendChild(p); }
    const eingaben = [];
    (felder || []).forEach(feld => {
      const i = document.createElement("input");
      i.type = "text"; i.value = feld.wert || ""; i.placeholder = feld.platzhalter || "";
      f.appendChild(i); eingaben.push(i);
    });
    const box = document.createElement("div");
    box.className = "fensterknoepfe";
    (knoepfe || [{ text:"OK", wert:true }]).forEach(k => {
      const b = document.createElement("button");
      b.className = "knopf" + (k.art === "leer" ? " leer" : k.art === "gefahr" ? " gefahr" : "");
      b.textContent = k.text;
      b.addEventListener("click", () => {
        fensterZu();
        fertig({ wahl:k.wert, werte:eingaben.map(e => e.value.trim()) });
      });
      box.appendChild(b);
    });
    f.appendChild(box);
    $("schleier").classList.add("an");
    if (eingaben.length) setTimeout(() => { eingaben[0].focus(); eingaben[0].select(); }, 60);
  });
}
const hinweis = (titel, text) => frage({ titel, text, knoepfe:[{ text:"Verstanden", wert:true }] });

/* Fenster mit Auswahlfeldern. Liefert die Werte unter ihren Namen. */
function formular({ titel, text, felder, knoepfe }){
  return new Promise(fertig => {
    const f = $("fenster");
    f.innerHTML = "";
    if (titel){ const h = document.createElement("h3"); h.textContent = titel; f.appendChild(h); }
    if (text){ const p = document.createElement("p"); p.textContent = text; f.appendChild(p); }

    const eingaben = {};
    for (const feld of (felder || [])){
      const l = document.createElement("label");
      l.textContent = feld.beschriftung;
      f.appendChild(l);
      let e;
      if (feld.art === "wahl"){
        e = document.createElement("select");
        for (const o of feld.optionen){
          const opt = document.createElement("option");
          opt.value = String(o.wert); opt.textContent = o.text;
          e.appendChild(opt);
        }
        e.value = String(feld.wert ?? (feld.optionen[0] && feld.optionen[0].wert));
      } else {
        e = document.createElement("input");
        e.type = "text";
        if (feld.art === "zahl") e.inputMode = "numeric";
        e.value = feld.wert ?? "";
        e.placeholder = feld.platzhalter || "";
      }
      f.appendChild(e);
      eingaben[feld.name] = e;
    }

    const box = document.createElement("div");
    box.className = "fensterknoepfe";
    for (const k of (knoepfe || [{ text:"OK", wert:true }])){
      const b = document.createElement("button");
      b.className = "knopf" + (k.art === "leer" ? " leer" : k.art === "gefahr" ? " gefahr" : "");
      b.textContent = k.text;
      b.addEventListener("click", () => {
        fensterZu();
        const werte = {};
        for (const n of Object.keys(eingaben)) werte[n] = eingaben[n].value;
        fertig({ wahl:k.wert, werte });
      });
      box.appendChild(b);
    }
    f.appendChild(box);
    $("schleier").classList.add("an");
  });
}

/* ---- Absicherungen ---- */

const SICHERUNG = {
  "LS":    { kennlinien:["B","C"], stroeme:[10,13,16,20,25,32,40,50,63], ma:null },
  "FI/LS": { kennlinien:["B","C"], stroeme:[10,13,16,20,25,32,40,50,63], ma:[30] },
  "FI":    { kennlinien:null,      stroeme:[25,40,63,125],               ma:[30,300] },
  "gG":    { kennlinien:null,      stroeme:[35,50,63,80,100,125,160,200,250,315,400,500], ma:null },
  "ohne":  { kennlinien:null,      stroeme:null,                         ma:null },
};
const ABGANGSARTEN = ["Schuko","CEE 16A","CEE 32A","CEE 63A","CEE 125A"];
/* Rangfolge der Steckergrößen. Ein Abgang ist nie größer als der
   Anschluss, an dem er hängt. */
const STECKERGROESSE = { "Schuko":1, "CEE 16A":2, "CEE 32A":3, "CEE 63A":4, "CEE 125A":5 };
const bisGroesse = (anschluss) =>
  ABGANGSARTEN.filter(x => STECKERGROESSE[x] <= (STECKERGROESSE[anschluss] || 99));

function sicherungVorgabe(art){
  return /CEE 32|CEE 63|CEE 125/.test(art)
    ? { art:"LS", kennlinie:"C", strom: art === "CEE 32A" ? 32 : 63, ma:null }
    : { art:"LS", kennlinie:"B", strom:16, ma:null };
}

function sicherungText(s){
  if (!s || !s.art || s.art === "ohne") return "ohne Absicherung";
  let t = s.art;
  if (s.kennlinie) t += " " + s.kennlinie + (s.strom ?? "");
  else if (s.strom) t += " " + s.strom + " A";
  if (s.ma) t += ", " + s.ma + " mA";
  return t;
}

/* Ein Abgang oder eine Gruppe kann ein freilassbares vorgeschaltetes
   Gerät führen. Steht eines da, wird die Kette mit Pfeil geschrieben. */
const hatGeraet = (s) => !!(s && s.art && s.art !== "ohne");
function kettenText(o){
  return (hatGeraet(o.vor) ? sicherungText(o.vor) + " → " : "") + sicherungText(o.sicherung);
}

/* Eigenes Fenster, weil die Felder von der Art abhängen. */
function sicherungWaehlen(aktuell, titel){
  return new Promise(fertig => {
    let stand = Object.assign({ art:"LS", kennlinie:"B", strom:16, ma:null }, aktuell || {});
    const f = $("fenster");

    function bauen(){
      f.innerHTML = "";
      const h = document.createElement("h3");
      h.textContent = titel || "Absicherung";
      f.appendChild(h);

      const bau = (beschriftung, optionen, wert, beiWahl) => {
        const l = document.createElement("label");
        l.textContent = beschriftung; f.appendChild(l);
        const e = document.createElement("select");
        for (const o of optionen){
          const opt = document.createElement("option");
          opt.value = String(o); opt.textContent = String(o);
          e.appendChild(opt);
        }
        e.value = String(wert);
        e.addEventListener("change", () => beiWahl(e.value));
        f.appendChild(e);
      };

      bau("Art", Object.keys(SICHERUNG), stand.art, (w) => {
        stand.art = w;
        const v = SICHERUNG[w];
        stand.kennlinie = v.kennlinien ? (v.kennlinien.includes(stand.kennlinie) ? stand.kennlinie : v.kennlinien[0]) : null;
        stand.strom = v.stroeme ? (v.stroeme.includes(stand.strom) ? stand.strom : v.stroeme[0]) : null;
        stand.ma = v.ma ? (v.ma.includes(stand.ma) ? stand.ma : v.ma[0]) : null;
        bauen();
      });
      const v = SICHERUNG[stand.art];
      if (v.kennlinien) bau("Charakteristik", v.kennlinien, stand.kennlinie, (w) => { stand.kennlinie = w; });
      if (v.stroeme)    bau("Nennstrom (A)", v.stroeme, stand.strom, (w) => { stand.strom = Number(w); });
      if (v.ma)         bau("Nennfehlerstrom (mA)", v.ma, stand.ma, (w) => { stand.ma = Number(w); });

      const box = document.createElement("div");
      box.className = "fensterknoepfe";
      const ok = document.createElement("button");
      ok.className = "knopf"; ok.textContent = "Übernehmen";
      ok.addEventListener("click", () => { fensterZu(); fertig(stand); });
      const ab = document.createElement("button");
      ab.className = "knopf leer"; ab.textContent = "Abbrechen";
      ab.addEventListener("click", () => { fensterZu(); fertig(null); });
      box.appendChild(ok); box.appendChild(ab);
      f.appendChild(box);
    }
    bauen();
    $("schleier").classList.add("an");
  });
}

/* ================================================================== */
/* Ablage (IndexedDB)                                                  */
/* ================================================================== */

const DB_NAME = "sf-eplan", DB_STAND = 2, LADEN = "plaene", EINST = "einstellungen";
let datenbank = null;

function dbOeffnen(){
  if (datenbank) return Promise.resolve(datenbank);
  return new Promise((ja, nein) => {
    const a = indexedDB.open(DB_NAME, DB_STAND);
    a.onupgradeneeded = () => {
      const d = a.result;

/* ---- Bausteine, Ebenen, Farben ---- */

const istPunkt = (o) => o && typeof o === "object" && typeof o.x === "number" && typeof o.y === "number";
function punkt(o){

  if (Array.isArray(o) && o.length >= 2 && typeof o[0] === "number") return { x:o[0], y:o[1] };
  return null;
}
const ersteZahl = (e, namen, ersatz) => { for (const n of namen) if (typeof e[n] === "number") return e[n]; return ersatz; };

const EINS = { a:1,b:0,c:0,d:1,e:0,f:0 };
const verkette = (m,n) => ({
  a:m.a*n.a+m.c*n.b, b:m.b*n.a+m.d*n.b, c:m.a*n.c+m.c*n.d, d:m.b*n.c+m.d*n.d,
  e:m.a*n.e+m.c*n.f+m.e, f:m.b*n.e+m.d*n.f+m.f });
const wende = (m,p) => ({ x:m.a*p.x+m.c*p.y+m.e, y:m.b*p.x+m.d*p.y+m.f });
const massstab = (m) => Math.sqrt(Math.abs(m.a*m.d - m.b*m.c)) || 1;

function aciCss(i){
  i = Math.abs(i|0);
  const fest = {0:"#000000",1:"#ff0000",2:"#ffff00",3:"#00ff00",4:"#00ffff",5:"#0000ff",
                6:"#ff00ff",7:"#000000",8:"#808080",9:"#c0c0c0",
                250:"#333333",251:"#505050",252:"#696969",253:"#828282",254:"#bebebe",255:"#ffffff",256:"#000000"};
  if (fest[i] !== undefined) return fest[i];
  if (i < 10 || i > 249) return "#000000";
  const gruppe = Math.floor((i-10)/10), stufe = (i-10)%10;
  const h = (gruppe*15)%360, s = (stufe%2===0)?1:0.55;
  const v = [1,1,0.78,0.78,0.62,0.62,0.47,0.47,0.32,0.32][stufe];
  const f = (n) => { const k=(n+h/60)%6; return Math.round(255*(v-v*s*Math.max(0,Math.min(k,4-k,1)))); };
  return (f(5)<<16 | f(3)<<8 | f(1));
}
function aciZahl(i){ const c = aciCss(i); return typeof c === "number" ? c : parseInt(c.slice(1),16); }

/* Farbe als Zahl 0xRRGGBB. "color" führt RGB, "colorIndex" die Palettennummer. */
function farbeVon(e, ebenen, geerbt){
  if (typeof e.color === "number" && e.color >= 0) return e.color & 0xFFFFFF;
  let ci = e.colorIndex ?? e.colorNumber;
  if (typeof ci === "object" && ci !== null) ci = ci.index;
  if (typeof ci !== "number") return geerbt ?? 0;
  if (ci === 0) return geerbt ?? 0;
  if (ci === 256 || ci < 0){
    const l = e.layer ? ebenen.get(e.layer) : null;
    if (l){
      if (typeof l.color === "number" && l.color >= 0) return l.color & 0xFFFFFF;
      let lc = l.colorIndex ?? l.colorNumber;
      if (typeof lc === "object" && lc !== null) lc = lc.index;
      if (typeof lc === "number") ci = Math.abs(lc);
    }
    if (ci === 256 || ci < 0) return geerbt ?? 0;

}

function sammleBloecke(db){
  const b = new Map(), gesehen = new Set();
  (function geh(o, t){
    if (!o || typeof o !== "object" || t > 5 || gesehen.has(o)) return;
    gesehen.add(o);
    if (Array.isArray(o)){ o.slice(0,6000).forEach(x => geh(x, t+1)); return; }
    if (typeof o.name === "string"){
      for (const k of ["entities","objects","items"]){
        const v = o[k];
        if (Array.isArray(v) && v.length && v.some(x => x && typeof x.type === "string")){
          const s = o.name.toLowerCase();
          if (!b.has(s)) b.set(s, v);
        }
      }
    }
    for (const k of Object.keys(o)) geh(o[k], t+1);

}
function sammleEbenen(db){
  const e = new Map(), gesehen = new Set();
  (function geh(o, t){
    if (!o || typeof o !== "object" || t > 5 || gesehen.has(o)) return;
    gesehen.add(o);
    if (Array.isArray(o)){ o.slice(0,4000).forEach(x => geh(x, t+1)); return; }
    const hatFarbe = ("color" in o) || ("colorIndex" in o);
    if (typeof o.name === "string" && hatFarbe && !("start" in o) && !("center" in o) && !("vertices" in o)){

function findeObjektliste(db){
  const treffer = [], gesehen = new Set();
  (function geh(o, t){
    if (!o || typeof o !== "object" || t > 4 || gesehen.has(o)) return;
    gesehen.add(o);
    if (Array.isArray(o)){
      const mit = o.filter(x => x && typeof x === "object" && typeof x.type === "string").length;
      if (o.length && mit/o.length > 0.5) treffer.push(o);
      return;
    }
    for (const k of Object.keys(o)) geh(o[k], t+1);

/* ---- Geometrie ---- */

function bulgePunkte(p0, p1, bulge){
  const theta = 4*Math.atan(bulge), d = Math.hypot(p1.x-p0.x, p1.y-p0.y);
  if (!d || !isFinite(theta) || Math.abs(theta) < 1e-6) return [p1];
  const r = d/(2*Math.sin(theta/2));
  if (!isFinite(r) || Math.abs(r) > d*1e4) return [p1];
  const h = r*Math.cos(theta/2), ux = (p1.x-p0.x)/d, uy = (p1.y-p0.y)/d;
  const cx = (p0.x+p1.x)/2 - uy*h, cy = (p0.y+p1.y)/2 + ux*h;
  const a0 = Math.atan2(p0.y-cy, p0.x-cx);
  const n = Math.max(2, Math.min(64, Math.ceil(Math.abs(theta)/0.15)));
  const aus = [];
  for (let i=1;i<=n;i++){ const a = a0 + theta*(i/n);
    aus.push({ x:cx+Math.abs(r)*Math.cos(a), y:cy+Math.abs(r)*Math.sin(a) }); }
  return aus;
}
function bogenPunkte(m, r, a1, a2){
  let sp = a2-a1; while (sp <= 0) sp += Math.PI*2;
  const n = Math.max(3, Math.min(96, Math.ceil(sp/0.12)));
  const aus = [];
  for (let i=0;i<=n;i++){ const a = a1 + sp*(i/n);
    aus.push({ x:m.x+r*Math.cos(a), y:m.y+r*Math.sin(a) }); }
  return aus;
}
function stuetzpunkte(v, schliessen){
  const pk = [];
  for (let i=0;i<v.length;i++){
    const p0 = punkt(v[i]); if (!p0) continue;
    if (!pk.length) pk.push(p0);
    const n = v[i+1] ? punkt(v[i+1]) : null, b = v[i].bulge ?? 0;
    if (n) pk.push(...(b ? bulgePunkte(p0, n, b) : [n]));
  }
  if (schliessen && v.length > 1){
    const l = punkt(v[v.length-1]), e = punkt(v[0]), b = v[v.length-1].bulge ?? 0;
    if (l && e && (l.x !== e.x || l.y !== e.y)) pk.push(...(b ? bulgePunkte(l, e, b) : [e]));
  }
  return pk;
}
function istGeschlossen(e){
  for (const n of ["closed","isClosed"]) if (typeof e[n] === "boolean") return e[n];
  for (const n of ["flag","flags","isClosed"]) if (typeof e[n] === "number")
    return (e[n] & 1) === 1 || (e[n] & 512) === 512;
  return false;
}
/* Runder Rand? Mitte aus dem umschließenden Rechteck, das ist beim Vollkreis exakt. */
function bahnKreis(pk){
  if (!pk || pk.length < 6) return null;
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  for (const p of pk){ if(p.x<x0)x0=p.x; if(p.x>x1)x1=p.x; if(p.y<y0)y0=p.y; if(p.y>y1)y1=p.y; }
  const bw = x1-x0, bh = y1-y0;
  if (!(bw>0) || !(bh>0) || Math.abs(bw-bh)/Math.max(bw,bh) > 0.06) return null;
  const cx = (x0+x1)/2, cy = (y0+y1)/2;

  for (const p of pk){ const r = Math.hypot(p.x-cx,p.y-cy); su+=r; if(r<rmin)rmin=r; if(r>rmax)rmax=r; }
  const rm = su/pk.length;
  if (!(rm>0) || (rmax-rmin)/rm > 0.06) return null;

const istSolide = (e) =>
  typeof e.solidFill === "number" ? e.solidFill !== 0 :
  typeof e.solidFill === "boolean" ? e.solidFill :
  /^solid$/i.test(String(e.patternName ?? "").trim());

function hatchBahnen(e){
  const raender = e.boundaryPaths || e.boundaries || e.paths;
  if (!Array.isArray(raender)) return [];
  const aus = [];
  for (const bahn of raender){
    let pk = [];
    const kanten = bahn.edges || bahn.entities || null;
    if (kanten && kanten.length){
      for (const k of kanten){
        const m = punkt(k.center || k.centerPoint);
        if (m && typeof k.radius === "number"){
          pk.push(...bogenPunkte(m, k.radius,
            alsBogen(ersteZahl(k,["startAngle"],0)), alsBogen(ersteZahl(k,["endAngle"],Math.PI*2))));
          continue;
        }
        const v = k.vertices || k.points;
        if (Array.isArray(v) && v.length){ pk.push(...stuetzpunkte(v, false)); continue; }
        const a = ersterPunkt(k,["start","startPoint","p1"]), b = ersterPunkt(k,["end","endPoint","p2"]);
        if (a && b){ if (!pk.length) pk.push(a); pk.push(b); }

      const v = bahn.vertices || bahn.points || (Array.isArray(bahn) ? bahn : null);

  let beste = null, weite = -1;

    for (const p of b){ if(p.x<x0)x0=p.x; if(p.x>x1)x1=p.x; if(p.y<y0)y0=p.y; if(p.y>y1)y1=p.y; }
    const w = Math.max(x1-x0, y1-y0);

/* ---- Zeichnung aufbauen ----
   Formen: 1 Linienzug · 2 Fläche · 3 Kreisumriss · 4 volle Scheibe · 5 Text  */

const FORM_ZUG=1, FORM_FLAECHE=2, FORM_KREIS=3, FORM_SCHEIBE=4, FORM_TEXT=5;
const HOECHSTZAHL = 500000;

function baueZeichnung(objekte, bloecke, ebenen){
  const stand = { teile:[], texte:[], standorte:[], bloecke, ebenen, voll:false };
  gehListe(objekte, EINS, 0, null, stand);
  return stand;
}
function gehListe(liste, mat, tiefe, geerbt, stand){
  if (!Array.isArray(liste) || tiefe > 6 || stand.voll) return;
  for (const e of liste){
    if (stand.voll) return;
    if (e && typeof e === "object") einObjekt(e, mat, tiefe, geerbt, stand);
  }
}
function lege(stand, form, punkte, farbe, radius){
  if (stand.teile.length >= HOECHSTZAHL){ stand.voll = true; return null; }
  for (const p of punkte) if (!isFinite(p.x) || !isFinite(p.y)) return null;
  const t = { form, punkte, farbe, radius:radius||0 };
  stand.teile.push(t);
  return t;
}

function einObjekt(e, mat, tiefe, geerbt, stand){
  const t = (e.type || "").toUpperCase();
  const c = farbeVon(e, stand.ebenen, geerbt);

  if (t === "INSERT" || t === "MINSERT" || t === "DIMENSION"){
    const name = String(e.name || e.blockName || "").toLowerCase();
    const ziel = stand.bloecke.get(name);
    if (!ziel) return;
    const p = ersterPunkt(e, ["insertionPoint","position","point"]) || { x:0, y:0 };
    const sx = ersteZahl(e, ["xScale","scaleX"], 1) || 1;
    const sy = ersteZahl(e, ["yScale","scaleY"], sx) || sx;
    const rot = alsBogen(ersteZahl(e, ["rotation","angle"], 0));

             tiefe+1, c, stand);
    return;
  }

  if (t === "HATCH"){
    const bahnen = hatchBahnen(e);
    if (!bahnen.length) return;
    const voll = istSolide(e);
    const rund = voll ? bahnKreis(groessteBahn(bahnen)) : null;
    if (rund){
      const m = wende(mat, rund);
      const r = rund.r * massstab(mat);
      const teil = lege(stand, FORM_SCHEIBE, [m], c, r);
      if (teil) stand.standorte.push({ x:m.x, y:m.y, r, farbe:c, teil:stand.teile.length-1 });
      return;
    }
    for (const bahn of bahnen){
      const pk = bahn.map(p => wende(mat, p));
      lege(stand, voll ? FORM_FLAECHE : FORM_ZUG, voll ? pk : pk.concat([pk[0]]), c);
    }

  }

    const a = ersterPunkt(e, ["startPoint","start","p1"]), b = ersterPunkt(e, ["endPoint","end","p2"]);
    if (a && b) lege(stand, FORM_ZUG, [wende(mat,a), wende(mat,b)], c);
    return;
  }

    const v = e.vertices || e.points || [];
    const pk = stuetzpunkte(v, istGeschlossen(e) && v.length > 2);
    if (pk.length >= 2) lege(stand, FORM_ZUG, pk.map(p => wende(mat,p)), c);
    return;
  }
  if (t === "CIRCLE"){
    const m = punkt(e.center);
    if (m && typeof e.radius === "number")
      lege(stand, FORM_KREIS, [wende(mat,m)], c, e.radius*massstab(mat));
    return;
  }
  if (t === "ARC"){
    const m = punkt(e.center);
    if (m && typeof e.radius === "number"){
      const pk = bogenPunkte(m, e.radius,
        alsBogen(ersteZahl(e,["startAngle"],0)), alsBogen(ersteZahl(e,["endAngle"],Math.PI*2)));
      lege(stand, FORM_ZUG, pk.map(p => wende(mat,p)), c);
    }

    const m = punkt(e.center), achse = ersterPunkt(e, ["majorAxisEndPoint","majorAxis"]);

    const gr = Math.hypot(achse.x, achse.y), verh = ersteZahl(e,["axisRatio","ratio"],1);

    for (let i=0;i<=n;i++){

    const roh = (e.fitPoints && e.fitPoints.length) ? e.fitPoints : (e.controlPoints || e.points || []);

    if (pk.length >= 2) lege(stand, FORM_ZUG, pk, c);
    return;
  }
  if (t === "TEXT" || t === "MTEXT" || t === "ATTRIB"){
    const m = ersterPunkt(e, ["startPoint","position","insertionPoint","point"]);
    const s = String(e.text ?? e.value ?? e.contents ?? "").replace(/\\[A-Za-z][^;]*;/g, "").trim();
    if (!m || !s) return;
    const p = wende(mat, m);
    stand.texte.push({
      x:p.x, y:p.y, farbe:c,
      h: ersteZahl(e, ["textHeight","height"], 2.5) * massstab(mat),
      dreh: alsBogen(ersteZahl(e, ["rotation","angle"], 0)),
      s: s.slice(0,150)
    });
  }
}

/* ---- Kernbereich und Ausreißer ---- */

function umgrenzung(punkte){
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  for (const p of punkte){ if(p.x<x0)x0=p.x; if(p.x>x1)x1=p.x; if(p.y<y0)y0=p.y; if(p.y>y1)y1=p.y; }

}
function kernbereich(teile){

  for (const t of teile){ const u = umgrenzung(t.punkte); cx.push((u.x0+u.x1)/2); cy.push((u.y0+u.y1)/2); }

  const q = (a,p) => a[Math.min(a.length-1, Math.max(0, Math.floor(a.length*p)))];
  const gx0=q(sx,0.01), gx1=q(sx,0.99), gy0=q(sy,0.01), gy1=q(sy,0.99);
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  teile.forEach((t,i) => {
    if (cx[i]>=gx0 && cx[i]<=gx1 && cy[i]>=gy0 && cy[i]<=gy1){
      const u = umgrenzung(t.punkte);
      const r = t.radius || 0;
      if (u.x0-r<x0) x0=u.x0-r; if (u.x1+r>x1) x1=u.x1+r;
      if (u.y0-r<y0) y0=u.y0-r; if (u.y1+r>y1) y1=u.y1+r;
    }
  });
  return isFinite(x0) ? { x0, y0, x1, y1 } : null;
}

/* ---- In kompakte Felder packen ---- */

function packen(stand){
  const kern = kernbereich(stand.teile);
  if (!kern) throw new Error("Die Zeichnung enthält nichts Darstellbares.");
  const mx = (kern.x0+kern.x1)/2, my = (kern.y0+kern.y1)/2;
  const spanne = Math.max(kern.x1-kern.x0, kern.y1-kern.y0) || 1;
  const grenze = spanne * 10;            // alles weiter draußen gilt als Ausreißer

  const behalten = [];
  let uebergangen = 0;
  for (const t of stand.teile){
    const u = umgrenzung(t.punkte);
    const px = (u.x0+u.x1)/2 - mx, py = (u.y0+u.y1)/2 - my;
    if (Math.abs(px) > grenze || Math.abs(py) > grenze){ uebergangen++; continue; }
    behalten.push(t);
  }

  let punktZahl = 0;
  for (const t of behalten) punktZahl += t.punkte.length;

  const formen = new Uint8Array(behalten.length);
  const farben = new Uint32Array(behalten.length);
  const starts = new Uint32Array(behalten.length + 1);
  const radien = new Float32Array(behalten.length);
  const kasten = new Float32Array(behalten.length * 4);
  const punkte = new Float32Array(punktZahl * 2);

  let k = 0;
  behalten.forEach((t, i) => {
    formen[i] = t.form; farben[i] = t.farbe; radien[i] = t.radius || 0; starts[i] = k;
    let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
    for (const p of t.punkte){
      const x = p.x - mx, y = p.y - my;
      punkte[k*2] = x; punkte[k*2+1] = y; k++;
      if (x<x0)x0=x; if (x>x1)x1=x; if (y<y0)y0=y; if (y>y1)y1=y;
    }
    const r = t.radius || 0;
    kasten[i*4]   = x0-r; kasten[i*4+1] = y0-r;
    kasten[i*4+2] = x1+r; kasten[i*4+3] = y1+r;
  });
  starts[behalten.length] = k;

  const drin = (p) => Math.abs(p.x-mx) <= grenze && Math.abs(p.y-my) <= grenze;

  return {
    nullpunkt: { x:mx, y:my },
    rand: { x0:kern.x0-mx, y0:kern.y0-my, x1:kern.x1-mx, y1:kern.y1-my },
    formen, farben, starts, radien, kasten, punkte,
    texte: stand.texte.filter(drin).map(t => ({ x:t.x-mx, y:t.y-my, h:t.h, dreh:t.dreh, s:t.s, farbe:t.farbe })),
    standorte: stand.standorte.filter(drin)
      .map((s,i) => ({ nr:i+1, x:s.x-mx, y:s.y-my, r:s.r, farbe:s.farbe })),
    uebergangen,
  };
}

async function dateiEinlesen(datei){
  await bibliothekHolen();
  arbeitAn("Lese " + (datei.size/1048576).toFixed(1) + " MB …");
  await naechsterRahmen();

  const istDxf = /\.dxf$/i.test(datei.name);
  const puffer = await datei.arrayBuffer();
  const typ = istDxf ? (DATEITYPEN.DXF ?? 1) : (DATEITYPEN.DWG ?? 0);
  const inhalt = istDxf ? new TextDecoder().decode(puffer) : new Uint8Array(puffer);

  let roh;
  try { roh = LIB.dwg_read_data(inhalt, typ); }
  catch(e){ roh = LIB.dwg_read_data(new Uint8Array(puffer), typ); }
  if (!roh) throw new Error("Die Datei konnte nicht gelesen werden.");
  const db = LIB.convert(roh);
  try { LIB.dwg_free(roh); } catch(e){}

  arbeitAn("Werte die Zeichnung aus …");
  await naechsterRahmen();

  const objekte = findeObjektliste(db);
  if (!objekte.length) throw new Error("In der Datei wurden keine Zeichenobjekte gefunden.");
  const stand = baueZeichnung(objekte, sammleBloecke(db), sammleEbenen(db));

  arbeitAn("Lege den Plan ab …");
  await naechsterRahmen();

  const gepackt = packen(stand);
  gepackt.nummernBilanz = standnummernZuordnen(gepackt);
  return Object.assign(gepackt, {
    id: "plan_" + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    name: datei.name.replace(/\.(dwg|dxf)$/i, ""),
    dateiname: datei.name,
    angelegt: Date.now(),
    teilzahl: gepackt.formen.length,
  });
}

const hex = (f) => "#" + (f & 0xFFFFFF).toString(16).padStart(6,"0");

/* ================================================================== */
/* 5 · Planansicht                                                     */
/* ================================================================== */

let PLAN = null;
let sicht = { x:0, y:0, m:1 };
const anzeige = { farbe:false, text:true };
let bahnen = null;      // vorgefertigte Pfade je Farbe
let AUSSCHNITT = null;  // gilt für alle Pläne, in Zeichnungskoordinaten
let zuschneiden = false;
let auswahl = null;     // Rechteck auf dem Schirm, während gezogen wird
let verteilerModus = false;
let gewaehlt = null;    // Kennung des ausgewählten Verteilers
let ortWahl = null;     // {art, ...}, solange ein Ort im Plan gesucht wird
let basisM = 0;         // Vergrößerung beim Einpassen, Bezug für die Grenzen
let inBewegung = false; // während Ziehen und Zoomen wird sparsamer gezeichnet

const leinwand = $("leinwand");
const ctx = leinwand.getContext("2d");

function schirmZeigen(id){
  document.querySelectorAll(".schirm").forEach(s => s.classList.toggle("an", s.id === id));
  /* Die Leinwand bekommt ihre Größe erst, wenn ihr Bildschirm wieder
     sichtbar ist. Wer hierher wechselt, zeichnet gleich danach. */
  if (id === "schirmPlan" && PLAN) groesseSetzen();
}

async function planOeffnen(id){
  arbeitAn("Öffne Plan …");
  await naechsterRahmen();
  PLAN = await planHolen(id);
  if (!PLAN){ arbeitAus(); return hinweis("Nicht gefunden", "Dieser Plan ist nicht mehr vorhanden."); }
  REICHWEITE = await reichweiteHolen();
  if (PLAN.standorte.length && PLAN.standorte[0].nummer === undefined){
    PLAN.nummernBilanz = standnummernZuordnen(PLAN);
    await planSpeichern(PLAN);
  }
  schirmZeigen("schirmPlan");
  if (AUSSCHNITT === null) AUSSCHNITT = await ausschnittHolen();
  bahnen = pfadeBauen(PLAN);
  await naechsterRahmen();
  groesseSetzen();
  einpassen();
  arbeitAus();
}
$("knopfZurueck").addEventListener("click", () => {

/* Pfade einmal je Plan bauen, danach kostet Zoomen fast nichts. */
function pfadeBauen(p){
  const striche = new Map(), flaechen = new Map();
  const hole = (karte, f) => { let b = karte.get(f); if (!b){ b = new Path2D(); karte.set(f, b); } return b; };

  for (let i=0;i<p.formen.length;i++){
    const form = p.formen[i], farbe = p.farben[i];
    if (form === FORM_SCHEIBE) continue;        // Standorte werden getrennt gezeichnet
    const a = p.starts[i], b = p.starts[i+1];
    if (form === FORM_KREIS){
      const x = p.punkte[a*2], y = p.punkte[a*2+1], r = Math.max(p.radien[i], 1e-4);
      const pfad = hole(striche, farbe);
      pfad.moveTo(x + r, y);
      pfad.arc(x, y, r, 0, Math.PI*2);
      continue;
    }
    if (b - a < 2) continue;
    const pfad = hole(form === FORM_FLAECHE ? flaechen : striche, farbe);
    pfad.moveTo(p.punkte[a*2], p.punkte[a*2+1]);
    for (let k=a+1;k<b;k++) pfad.lineTo(p.punkte[k*2], p.punkte[k*2+1]);
    if (form === FORM_FLAECHE) pfad.closePath();
  }
  return { striche, flaechen };
}

/* Nur aufrufen, solange die Planansicht sichtbar ist: im verborgenen
   Zustand liefert der Rahmen 0 × 0, die Leinwand würde auf 1 × 1
   schrumpfen und beim Zurückkommen leer bleiben. */
function groesseSetzen(){
  const r = $("leinwandRahmen").getBoundingClientRect();
  if (r.width < 2 || r.height < 2) return r;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const br = Math.max(1, Math.round(r.width*dpr)), ho = Math.max(1, Math.round(r.height*dpr));
  leinwand.width = br; leinwand.height = ho;
  oberflaeche.width = br; oberflaeche.height = ho;
  return r;
}
/* Der gespeicherte Ausschnitt steht in Zeichnungskoordinaten und wird
   für den geöffneten Plan in dessen Bezugspunkt umgerechnet. Liegt er
   ganz außerhalb, wird er ignoriert. */
function ausschnittFuerPlan(){
  if (!PLAN || !AUSSCHNITT) return null;
  const n = PLAN.nullpunkt, b = PLAN.rand;
  const a = { x0:AUSSCHNITT.x0-n.x, y0:AUSSCHNITT.y0-n.y,
              x1:AUSSCHNITT.x1-n.x, y1:AUSSCHNITT.y1-n.y };
  if (a.x1 < b.x0 || a.x0 > b.x1 || a.y1 < b.y0 || a.y0 > b.y1) return null;
  return a;
}

function einpassen(){
  if (!PLAN) return;
  const r = groesseSetzen();
  const b = ausschnittFuerPlan() || PLAN.rand;
  const bw = Math.max(1e-6, b.x1-b.x0), bh = Math.max(1e-6, b.y1-b.y0);
  sicht.m = Math.min(r.width/bw, r.height/bh) * 0.95;
  basisM = sicht.m;
  sicht.x = r.width/2  - ((b.x0+b.x1)/2) * sicht.m;
  sicht.y = r.height/2 + ((b.y0+b.y1)/2) * sicht.m;
  zeichne();
}

/* Auf weißem Grund ist reines Weiß unsichtbar; CAD dreht Linien beim Ausgeben um.
   Flächen bleiben davon unberührt, sonst entstünden schwarze Klötze.
   Im Schwarz-Weiß-Modus werden Linien vereinheitlicht, Flächen behalten
   ihre Helligkeit: ein Hellgrau bleibt exakt hellgrau, eine farbige Fläche
   wird zu einem Grau derselben Helligkeit. */
function helligkeit(f){
  return (0.299*((f>>16)&255) + 0.587*((f>>8)&255) + 0.114*(f&255)) / 255;
}
function grauwert(f){
  const s = Math.round(helligkeit(f)*255).toString(16).padStart(2,"0");
  return "#" + s + s + s;
}
const sichtbar = (f) => helligkeit(f) > 0.95 ? "#000000" : hex(f);
const strichFarbe  = (f) => anzeige.farbe ? sichtbar(f) : "#1B2430";
const flaechenFarbe = (f) => anzeige.farbe ? hex(f) : grauwert(f);

/* Verteiler liegen in Zeichnungskoordinaten, damit sie später ohne
   Umrechnung in eine neue Planfassung übernommen werden können. */
const verteilerListe = () => (PLAN && PLAN.verteiler) || [];
const VERTEILER_SEITE = 20;

function verteilerAufSchirm(v){
  const n = PLAN.nullpunkt;
  return { x: sicht.x + (v.x-n.x)*sicht.m, y: sicht.y - (v.y-n.y)*sicht.m };
}
function verteilerUnter(sx, sy){
  let beste = null, naeheste = VERTEILER_SEITE;
  for (const v of verteilerListe()){
    const p = verteilerAufSchirm(v);
    const d = Math.max(Math.abs(p.x-sx), Math.abs(p.y-sy));
    if (d < naeheste){ naeheste = d; beste = v; }
  }
  return beste;
}

function verteilerZeichnen(r, dpr){
  const liste = verteilerListe();
  if (!liste.length) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const h = VERTEILER_SEITE, halb = h/2;

  for (const v of liste){
    const p = verteilerAufSchirm(v);
    if (p.x < -80 || p.y < -40 || p.x > r.width+160 || p.y > r.height+40) continue;
    const gewaehltJetzt = v.id === gewaehlt;
    const mobil = v.art === "mobil";

    if (gewaehltJetzt){
      ctx.strokeStyle = "#17726B";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, h, 0, Math.PI*2);
      ctx.stroke();
    }

    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(p.x-halb, p.y-halb, h, h, 5);
    else ctx.rect(p.x-halb, p.y-halb, h, h);
    ctx.fillStyle = mobil ? "#ffffff" : "#17726B";
    ctx.fill();
    ctx.strokeStyle = mobil ? "#17726B" : "#ffffff";
    ctx.lineWidth = mobil ? 2.5 : 2;
    ctx.stroke();

    ctx.font = "600 12px -apple-system,Segoe UI,Helvetica,Arial,sans-serif";
    ctx.textBaseline = "middle";
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#ffffff";
    ctx.strokeText(v.name, p.x+halb+5, p.y);
    ctx.fillStyle = "#1B2430";
    ctx.fillText(v.name, p.x+halb+5, p.y);
  }
  ctx.textBaseline = "alphabetic";
}

/* Verbraucher hängen an einem Abgang und tragen einen Ort im Plan.
   Gezeichnet als Ring, damit ein darunter liegender Standort sichtbar bleibt. */
const SCHRIFT_AB = 1.4;   // ab dieser Vergrößerung werden Namen geschrieben

function alleVerbraucher(){
  const aus = [];
  for (const v of verteilerListe())
    for (const a of (v.abgaenge || []))
      if (a.verbraucher && a.verbraucher.x !== null && a.verbraucher.x !== undefined)
        aus.push({ v, a, b:a.verbraucher });
  return aus;
}

function verbraucherZeichnen(r, dpr){
  const liste = alleVerbraucher();
  if (!liste.length) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const n = PLAN.nullpunkt;
  const beschriften = sicht.m >= SCHRIFT_AB;

  for (const { v, a, b } of liste){
    const x = sicht.x + (b.x-n.x)*sicht.m;
    const y = sicht.y - (b.y-n.y)*sicht.m;
    if (x < -80 || y < -40 || x > r.width+160 || y > r.height+40) continue;

    ctx.beginPath();
    ctx.arc(x, y, 8, 0, Math.PI*2);
    ctx.setLineDash([]);
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 4; ctx.stroke();
    if (b.ortVeraltet) ctx.setLineDash([3,3]);
    ctx.strokeStyle = "#1B2430"; ctx.lineWidth = 2; ctx.stroke();
    ctx.setLineDash([]);

    if (beschriften){
      const nr = (v.abgaenge.indexOf(a) + 1);
      const t = (b.name || "Verbraucher") + " · " + v.name + "/" + nr;
      ctx.font = "500 11px -apple-system,Segoe UI,Helvetica,Arial,sans-serif";
      ctx.textBaseline = "middle";
      ctx.lineWidth = 3; ctx.strokeStyle = "#ffffff";
      ctx.strokeText(t, x+12, y+10);
      ctx.fillStyle = "#1B2430";
      ctx.fillText(t, x+12, y+10);
      ctx.textBaseline = "alphabetic";
    }
  }
}

function zeichne(){
  if (!PLAN || !bahnen) return;
  zustandZaehler.plan++;
  const r = $("leinwandRahmen").getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const schnitt = zuschneiden ? null : ausschnittFuerPlan();

  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, leinwand.width, leinwand.height);

  ctx.setTransform(sicht.m*dpr, 0, 0, -sicht.m*dpr, sicht.x*dpr, sicht.y*dpr);
  ctx.lineWidth = 1/sicht.m;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";

  ctx.save();
  if (schnitt){
    ctx.beginPath();
    ctx.rect(schnitt.x0, schnitt.y0, schnitt.x1-schnitt.x0, schnitt.y1-schnitt.y0);
    ctx.clip();
  }
  for (const [farbe, pfad] of bahnen.flaechen){
    ctx.fillStyle = flaechenFarbe(farbe);
    ctx.fill(pfad);
  }
  for (const [farbe, pfad] of bahnen.striche){
    ctx.strokeStyle = strichFarbe(farbe);
    ctx.stroke(pfad);
  }
  ctx.restore();

  standorteZeichnen(r, dpr, schnitt);
  if (anzeige.text && !(inBewegung && PLAN.texte.length > 400))
    texteZeichnen(r, dpr, schnitt);
  verbraucherZeichnen(r, dpr);
  verteilerZeichnen(r, dpr);
  oberflaecheZeichnen();
  if (zuschneiden) auswahlZeichnen(r, dpr);
}

/* Beim Zuschneiden liegt ein Schleier über allem außerhalb des Rechtecks. */
function auswahlZeichnen(r, dpr){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const a = auswahl || rechteckAufSchirm(ausschnittFuerPlan());
  ctx.fillStyle = "rgba(27,36,48,.38)";
  if (!a){
    ctx.fillRect(0, 0, r.width, r.height);
    return;
  }
  ctx.beginPath();
  ctx.rect(0, 0, r.width, r.height);
  ctx.rect(a.x0, a.y0, a.x1-a.x0, a.y1-a.y0);
  ctx.fill("evenodd");
  ctx.strokeStyle = "#17726B";
  ctx.lineWidth = 2;
  ctx.strokeRect(a.x0, a.y0, a.x1-a.x0, a.y1-a.y0);
}
function rechteckAufSchirm(b){
  if (!b) return null;
  const X = (x) => sicht.x + x*sicht.m, Y = (y) => sicht.y - y*sicht.m;
  return { x0:X(b.x0), y0:Y(b.y1), x1:X(b.x1), y1:Y(b.y0) };
}

/* Standorte sitzen in Bildschirmkoordinaten, damit sie auch in der
   Übersicht sichtbar bleiben. Bei Radius 0,55 wären es sonst 0,4 Bildpunkte. */
const STANDORT_MIN = 3.5;

/* Welche der gefundenen Kreise gelten als Standort? Das entscheidet
   der Nutzer je Plan über die Farbe, die App rät nicht. */
function standorteAktiv(p){
  const aus = new Set(p.farbenAus || []);
  return p.standorte.filter(s => !aus.has(s.farbe));
}

function standorteZeichnen(r, dpr, schnitt){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const X = (x) => sicht.x + x*sicht.m;
  const Y = (y) => sicht.y - y*sicht.m;

  for (const s of standorteAktiv(PLAN)){
    if (schnitt && (s.x < schnitt.x0 || s.x > schnitt.x1 || s.y < schnitt.y0 || s.y > schnitt.y1)) continue;
    const x = X(s.x), y = Y(s.y);
    if (x < -30 || y < -30 || x > r.width+30 || y > r.height+30) continue;
    const rr = Math.max(s.r * sicht.m, STANDORT_MIN);
    ctx.fillStyle = sichtbar(s.farbe);
    ctx.beginPath();
    ctx.arc(x, y, rr, 0, Math.PI*2);
    ctx.fill();
  }
}

function texteZeichnen(r, dpr, schnitt){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.textBaseline = "alphabetic";
  const X = (x) => sicht.x + x*sicht.m;
  const Y = (y) => sicht.y - y*sicht.m;
  for (const t of PLAN.texte){
    if (schnitt && (t.x < schnitt.x0 || t.x > schnitt.x1 || t.y < schnitt.y0 || t.y > schnitt.y1)) continue;
    const h = t.h * sicht.m;
    if (h < 5 || h > 300) continue;
    const x = X(t.x), y = Y(t.y);
    if (x < -200 || y < -200 || x > r.width+200 || y > r.height+200) continue;
    ctx.save();
    ctx.translate(x, y);
    if (t.dreh) ctx.rotate(-t.dreh);
    ctx.font = h.toFixed(1) + "px -apple-system,Segoe UI,Helvetica,Arial,sans-serif";
    ctx.fillStyle = anzeige.farbe ? sichtbar(t.farbe) : "#1B2430";
    ctx.fillText(t.s, 0, 0);
    ctx.restore();
  }
}

/* Welche Farben gelten als Standort? */
function farbenWaehlen(){
  const zaehler = new Map();
  for (const s of PLAN.standorte) zaehler.set(s.farbe, (zaehler.get(s.farbe)||0) + 1);
  const reihen = [...zaehler.entries()].sort((x,y) => y[1]-x[1]);
  const aus = new Set(PLAN.farbenAus || []);

  const f = $("fenster");
  f.innerHTML = "";
  const h = document.createElement("h3");
  h.textContent = "Standortfarben";
  f.appendChild(h);
  const p = document.createElement("p");
  p.textContent = "Angehakte Farben zählen als Verbraucherstandort.";
  f.appendChild(p);

  const liste = document.createElement("div");
  liste.className = "farbliste";
  reihen.forEach(([farbe, anzahl]) => {
    const zeile = document.createElement("button");
    zeile.className = "farbzeile" + (aus.has(farbe) ? "" : " an");
    zeile.innerHTML =
      '<span class="probe" style="background:' + sichtbar(farbe) + '"></span>' +
      '<span class="anzahl"></span><span class="haken">✓</span>';
    zeile.querySelector(".anzahl").textContent =
      anzahl === 1 ? "1 Kreis" : anzahl + " Kreise";
    zeile.addEventListener("click", () => {
      if (aus.has(farbe)) aus.delete(farbe); else aus.add(farbe);
      zeile.classList.toggle("an", !aus.has(farbe));
    });
    liste.appendChild(zeile);
  });
  f.appendChild(liste);

  const box = document.createElement("div");
  box.className = "fensterknoepfe";
  const ok = document.createElement("button");
  ok.className = "knopf";
  ok.textContent = "Übernehmen";
  ok.addEventListener("click", async () => {
    fensterZu();
    PLAN.farbenAus = [...aus];
    await planSpeichern(PLAN);
    zeichne();
  });
  const ab = document.createElement("button");
  ab.className = "knopf leer";
  ab.textContent = "Abbrechen";
  ab.addEventListener("click", () => $("schleier").classList.remove("an"));
  box.appendChild(ok); box.appendChild(ab);
  f.appendChild(box);

  $("schleier").classList.add("an");
}

/* Grenzen fürs Setzen: der Ausschnitt, sonst der Plan selbst. */
function setzGrenze(){
  const n = PLAN.nullpunkt;
  if (AUSSCHNITT) return AUSSCHNITT;
  const b = PLAN.rand;
  return { x0:b.x0+n.x, y0:b.y0+n.y, x1:b.x1+n.x, y1:b.y1+n.y };
}
const imBereich = (p, g) => p.x >= g.x0 && p.x <= g.x1 && p.y >= g.y0 && p.y <= g.y1;

function schirmZuZeichnung(sx, sy){
  const n = PLAN.nullpunkt;
  return { x:(sx - sicht.x)/sicht.m + n.x, y:(sicht.y - sy)/sicht.m + n.y };
}

async function verteilerSetzen(sx, sy){
  const p = schirmZuZeichnung(sx, sy);
  if (!imBereich(p, setzGrenze())){
    return hinweis("Außerhalb des Ausschnitts",
      AUSSCHNITT ? "Verteiler lassen sich nur innerhalb des festgelegten Ausschnitts setzen. "
                 + "Über „Ausschnitt“ kannst du ihn ändern oder ganz aufheben."
                 : "Diese Stelle liegt außerhalb des Plans.");
  }
  if (!PLAN.verteiler) PLAN.verteiler = [];
  const nummern = PLAN.verteiler.map(v => {
    const m = /^UV\s*(\d+)$/i.exec(v.name);
    return m ? Number(m[1]) : 0;

  });

              name: a.werte[0] || vorschlag, x:p.x, y:p.y };

  await planSpeichern(PLAN);
  verteilerLeisteAuffrischen();
  zeichne();
}

/* ---- Ort eines Verbrauchers im Plan wählen ---- */

const EINRAST = 22;   // Bildpunkte, innerhalb derer auf einen Standort gerastet wird

function standortUnter(sx, sy){
  const n = PLAN.nullpunkt;
  let beste = null, nah = EINRAST;
  for (const s of standorteAktiv(PLAN)){
    const x = sicht.x + s.x*sicht.m, y = sicht.y - s.y*sicht.m;
    const d = Math.hypot(x-sx, y-sy);
    if (d < nah){ nah = d; beste = s; }
  }
  return beste;
}

}

}
function ortWahlBeenden(zielId){
