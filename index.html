/* ================================================================== */
/* 12 · Prinzipschaltbild                                              */
/* ================================================================== */

/* Aufbau wie in der Vorlage: senkrechte Sammelschiene links, Abgänge
   waagerecht nach rechts, am Ende ein beschriftetes Rechteck. Der Leiter
   läuft durch die Zeichen hindurch; nur der bewegliche Kontakt eines
   Schalters hebt sich ab. Gruppen hängen an einer Untersammelschiene. */

const BG_BREITE  = 1024;
const PDF_BREITE = 1130;
const S_RAND     = 46;
const S_NUTZ     = BG_BREITE - 2*S_RAND;   // 932

const X_SCHIENE  = 62;    // Hauptsammelschiene
const X_GERAET   = 210;   // erste Geräte-Spalte
const SP_SCHRITT = 130;   // Abstand zweier Geräte-Spalten
const X_RAND     = 926;   // rechte Kante des Zielrechtecks
const H_KASTEN   = 36;

/* Diese vier hängen davon ab, wie viele Geräte hintereinander stehen.
   Sie werden je Blatt in schaltbildEinerVerteiler gesetzt. */
let X_UNTER = 340, X_KASTEN = 640, B_KASTEN = 286, X_ADER = 594;

const Y_KOPF   = 140;    // erste Abgangszeile
const Y_ZEILE  = 100;

const esc = (t) => String(t == null ? "" : t)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

const L = (x1,y1,x2,y2,w) =>
  `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#000" stroke-width="${w||1.3}"/>`;
const T = (x,y,txt,groesse,anker,fett) =>
  `<text x="${x}" y="${y}" font-size="${groesse||11}" font-family="Helvetica,Arial"` +
  ` text-anchor="${anker||"start"}"${fett?' font-weight="700"':''} fill="#000">${esc(txt)}</text>`;

/* ---- Schaltzeichen ---- */

/* Schrägstrich mit Ziffer, für Polzahl am Gerät und Aderzahl auf der
   Leitung. Die Neigung bleibt absolut, auch wenn der Leiter senkrecht
   läuft; die Ziffer steht am oberen Ende. "kurz" kürzt den unteren
   Schenkel, damit er die Beschriftung unter dem Zeichen nicht berührt. */
const STR_X = 15, STR_Y = 24, STR_DICK = 0.9, STR_ZIFFER = 11.5, STR_KURZ = 0.75;
function strich(x, y, zahl, kurz){
  if (!zahl) return "";
  const f = kurz ? STR_KURZ : 1;
  return L(x - STR_X*f, y + STR_Y*f, x + STR_X, y - STR_Y, STR_DICK) +
         T(x + STR_X + 2, y - STR_Y, String(zahl), STR_ZIFFER, "start");
}

/* Beschriftung: am waagerechten Leiter einzeilig mittig unter dem
   Zeichen, am senkrechten zweizeilig rechts daneben. Abstände für alle
   Zeichen gleich. */
const BE_ABSTAND = 30, BE_ABSTAND_S = 20, BE_ZEILE = 17, BE_GROESSE = 13.5;
function beschriftung(x, y, oben, unten, senkrecht){
  if (!oben && !unten) return "";
  if (senkrecht){
    if (!oben) return T(x + BE_ABSTAND_S, y - 3, unten, BE_GROESSE, "start");
    return T(x + BE_ABSTAND_S, y - 3, oben, BE_GROESSE, "start", true) +
           T(x + BE_ABSTAND_S, y - 3 + BE_ZEILE, unten || "", BE_GROESSE, "start");
  }
  return T(x, y + BE_ABSTAND, [oben, unten].filter(Boolean).join(" "), BE_GROESSE, "middle");
}

/* Schmelzsicherung: längliches Rechteck auf dem Leiter, der Leiter läuft
   hindurch. Keine eigene Diagonale – was schräg hindurchläuft, ist der
   Polstrich. */
const SICH_LANG = 58, SICH_QUER = 20;
function symSicherung(x, y, senkrecht){
  const w = senkrecht ? SICH_QUER : SICH_LANG;
  const h = senkrecht ? SICH_LANG : SICH_QUER;
  return `<rect x="${x - w/2}" y="${y - h/2}" width="${w}" height="${h}" fill="none" stroke="#000" stroke-width="1.6"/>`;
}

/* Schließerkontakt: das Gelenk sitzt auf der Verbraucherseite, der
   bewegliche Teil hebt nach links oben ab. Der Leiter ist unterbrochen. */
const K_SPITZE = 16, K_GELENK = 18, K_HOCH = 22;
function symKontakt(x, y){
  return L(x + K_GELENK, y, x - K_SPITZE, y - K_HOCH, 1.7);
}
/* Höhe des beweglichen Teils an einer Stelle xx */
function aufBlatt(x, y, xx){
  return Math.round((y - K_HOCH * ((x + K_GELENK - xx) / (K_GELENK + K_SPITZE))) * 10) / 10;
}

/* Auslöser: senkrechter Pfeil, steht auf dem beweglichen Teil */
const PF_LANG = 21, PF_KOPF = 11;
function pfeil(x, yFuss){
  const kopf = yFuss - PF_LANG;
  return L(x, yFuss, x, kopf + PF_KOPF - 1, 1.5) +
         `<path d="M ${x} ${kopf} L ${x-4.6} ${kopf+PF_KOPF} L ${x+4.6} ${kopf+PF_KOPF} Z" fill="#000"/>`;
}

/* Fehlerstromauslösung: kleines T dicht über der Pfeilspitze, Balken
   unten, Stiel nach oben. */
const T_BREIT = 6.5, T_STIEL = 10, T_LUFT = 2;
function tZeichen(x, yFuss){
  const quer = yFuss - PF_LANG - T_LUFT;
  return L(x - T_BREIT, quer, x + T_BREIT, quer, 1.2) +
         L(x, quer, x, quer - T_STIEL, 1.2);
}

/* Zielrechteck mit Beschriftung */
function symKasten(y, oben, unten){
  let s = `<rect x="${X_KASTEN}" y="${y - H_KASTEN/2}" width="${B_KASTEN}" height="${H_KASTEN}"
             fill="#fff" stroke="#000" stroke-width="1.3"/>`;
  if (unten){
    s += T(X_KASTEN + 12, y - 2, oben, 13, "start", true);
    s += T(X_KASTEN + 12, y + 13, unten, 11, "start");
  } else {
    s += T(X_KASTEN + 12, y + 5, oben, 13, "start", true);
  }
  return s;
}

/* Ein Schalter unterbricht den Leiter, eine Sicherung nicht. */
function unterbricht(sicherung){
  const art = sicherung && sicherung.art;
  return art === "LS" || art === "FI" || art === "FI/LS";
}

function zeichenFuer(sicherung, x, y, senkrecht){
  const art = sicherung && sicherung.art;
  if (art === "gG") return symSicherung(x, y, senkrecht);
  if (art !== "LS" && art !== "FI" && art !== "FI/LS") return "";
  const xs = x - K_SPITZE, ys = y - K_HOCH;
  let z = symKontakt(x, y) + pfeil(xs, ys);
  if (art === "FI" || art === "FI/LS") z += tZeichen(xs, ys);
  if (art === "FI/LS")                 z += pfeil(x - 3, aufBlatt(x, y, x - 3));
  // Bei senkrechtem Leiter wird dasselbe Zeichen gedreht, nicht neu erfunden.
  return senkrecht ? `<g transform="rotate(90 ${x} ${y})">${z}</g>` : z;
}

/* Der Polstrich läuft durch das Zeichen. Beim waagerechten Kontakt
   liegt er in der Mitte des beweglichen Teils, beim senkrechten dort,
   wohin die Drehung diesen Punkt bringt. Nur unter der waagerechten
   Sicherung wird er unten gekürzt, weil dort die Beschriftung steht. */
function polstrich(sicherung, x, y, zahl, senkrecht){
  if (!zahl) return "";
  const art = sicherung && sicherung.art;
  if (art === "gG") return strich(x, y, zahl, !senkrecht);
  if (art !== "LS" && art !== "FI" && art !== "FI/LS") return "";
  const dx = (K_GELENK - K_SPITZE) / 2, dy = -K_HOCH / 2;
  return senkrecht ? strich(x - dy, y + dx, zahl) : strich(x + dx, y + dy, zahl);
}

/* ---- Ableitungen ---- */

function aderzahl(art){
  if (!art) return null;
  if (/^Schuko/i.test(art)) return 3;
  if (/^CEE/i.test(art))    return 5;
  return null;
}
/* Wie viele Pole unterbricht das Gerät? Ein LS im Drehstromabgang trennt
   die drei Außenleiter, im Wechselstromkreis einen; ein FI trennt
   zusätzlich den Neutralleiter. */
function polzahl(sicherung, art){
  if (!sicherung || sicherung.art === "ohne") return null;
  const drei = /^CEE/i.test(art || "");
  switch (sicherung.art){
    case "FI":    return 4;
    case "FI/LS": return drei ? 4 : 2;
    case "LS":    return drei ? 3 : 1;
    case "gG":    return 3;
    default:      return null;
  }
}
/* Beschriftungstext eines Zeichens. Die Gerätebezeichnung entfällt bei
   FI und FI/LS, die steht im Schaltzeichen; genannt werden Kennlinie,
   Nennstrom und Nennfehlerstrom. */
function bemessung(s){
  if (!s || !s.art || s.art === "ohne") return "";
  const t = [];
  if (s.art === "gG") t.push("gG");
  if (s.kennlinie)    t.push(s.kennlinie);
  if (s.strom)        t.push(s.strom + " A");
  if (s.ma)           t.push(s.ma + " mA");
  return t.join(" ");
}

/* ---- Ein Verteiler ---- */

/* Die Kette läuft von der Schiene zum Verbraucher: erst das
   vorgeschaltete Gerät, dann das eigentliche. */
const kette = (o) => [o && o.vor, o && o.sicherung].filter(hatGeraet);

/* Geräte-Spalten ab x0 */
function spaltenAb(x0, anzahl){
  const s = [];
  for (let i = 0; i < anzahl; i++) s.push(x0 + i * SP_SCHRITT);
  return s;
}

/* Eine waagerechte Leitung mit ihren Geräten. Schalter unterbrechen den
   Leiter, Sicherungen nicht. */
function reiheZeichnen(teile, xVon, xBis, y, geraete, spalten, art){
  let x = xVon;
  geraete.forEach((s, i) => {
    const xg = spalten[i];
    if (unterbricht(s)){
      teile.push(L(x, y, xg - K_SPITZE, y, 1.3));
      x = xg + K_GELENK;
    }
    teile.push(zeichenFuer(s, xg, y));
    teile.push(polstrich(s, xg, y, polzahl(s, art)));
    teile.push(beschriftung(xg, y, bemessung(s), ""));
  });
  teile.push(L(x, y, xBis, y, 1.3));
}

function schaltbildEinerVerteiler(v, nummerVon){
  const abg = v.abgaenge || [];
  const rcds = v.rcds || [];
  const gruppen = rcds.map(r => ({ rcd:r, abgaenge: abg.filter(a => a.rcd === r.id) }))
                      .filter(g => g.abgaenge.length);
  const inGruppe = new Set(gruppen.map(g => g.rcd.id));
  const direkt = abg.filter(a => !a.rcd || !inGruppe.has(a.rcd));

  /* Wie lang ist die längste Kette in jedem Bereich? Danach richten sich
     die Spalten, damit gleichartige Geräte untereinander stehen. Ohne
     vorgeschaltetes Gerät bleibt alles, wo es immer stand. */
  const laenge = (o) => Math.max(1, kette(o).length);
  const spDirekt = spaltenAb(X_GERAET, Math.max(1, ...direkt.map(laenge)));
  const spStich  = spaltenAb(X_GERAET, Math.max(1, ...gruppen.map(g => laenge(g.rcd))));
  const nKind    = Math.max(1, ...gruppen.map(g => Math.max(1, ...g.abgaenge.map(laenge))));

  X_UNTER  = spStich[spStich.length - 1] + 130;
  const spKind = spaltenAb(X_UNTER + (nKind > 1 ? 70 : 112), nKind);
  const letzteSpalte = Math.max(spDirekt[spDirekt.length - 1], spKind[spKind.length - 1]);
  X_KASTEN = Math.min(Math.max(640, letzteSpalte + 125), X_RAND - 200);
  B_KASTEN = X_RAND - X_KASTEN;
  X_ADER   = X_KASTEN - 46;

  const teile = [];
  let y = Y_KOPF;
  let letzteSchiene = y;

  /* Ein Abgang, waagerecht */
  const abgangZeichnen = (a, xVon, spalten, punkt) => {
    const nr = abg.indexOf(a) + 1;
    const ziel = a.mobil ? verteilerNach(a.mobil) : null;
    const b = a.verbraucher;
    const geraete = kette(a);
    const sp = spalten.slice(spalten.length - Math.max(1, geraete.length));

    reiheZeichnen(teile, xVon, X_KASTEN, y, geraete, sp, a.art);
    if (punkt !== false) teile.push(`<circle cx="${xVon}" cy="${y}" r="2.6" fill="#000"/>`);
    /* Aderzahl der Leitung, hinter dem letzten Schutzorgan – nur wenn
       dort noch Platz ist. */
    if (X_ADER - sp[sp.length - 1] >= 66) teile.push(strich(X_ADER, y, aderzahl(a.art)));
    teile.push(T(xVon + 10, y - 10, "Abg. " + nr + (a.name ? " · " + a.name : ""), 10.5, "start"));

    const kastenOben = a.art || "Abgang";
    const kastenUnten = ziel ? ziel.name + " · Blatt " + nummerVon(ziel.id)
                     : b ? (b.name || "Verbraucher") +
                           (b.standnummer ? " · " + b.standnummer : "")
                     : "frei";
    teile.push(symKasten(y, kastenOben, kastenUnten));
    y += Y_ZEILE;
  };

  for (const a of direkt){ abgangZeichnen(a, X_SCHIENE, spDirekt); letzteSchiene = y - Y_ZEILE; }

  for (const g of gruppen){
    const yStich = y;
    const kt = kette(g.rcd);
    const sp = spStich.slice(spStich.length - Math.max(1, kt.length));
    reiheZeichnen(teile, X_SCHIENE, X_UNTER, yStich, kt, sp, "CEE");
    teile.push(`<circle cx="${X_SCHIENE}" cy="${yStich}" r="2.6" fill="#000"/>`);
    teile.push(T(X_SCHIENE + 10, yStich - 10, g.rcd.name, 10.5, "start", true));
    letzteSchiene = yStich;

    /* Der erste Abgang der Gruppe läuft auf derselben Zeile weiter: die
       Leitung geht ohne Knick vom RCD durch. Erst die weiteren Abgänge
       hängen an der Untersammelschiene. Ein Abzweigpunkt wird nur
       gesetzt, wenn dort wirklich etwas abzweigt. */
    const mehrere = g.abgaenge.length > 1;
    g.abgaenge.forEach((a) => abgangZeichnen(a, X_UNTER, spKind, mehrere));
    const letztesKind = y - Y_ZEILE;
    if (mehrere) teile.push(L(X_UNTER, yStich, X_UNTER, letztesKind, 1.8));
    y += 8;
  }

  /* Einspeisung oben und Hauptsammelschiene */
  const kopf = [];
  let zuSicherung = null, zuArt = null;
  if (v.art === "mobil"){
    const q = v.quelle && verteilerNach(v.quelle.uvId);
    const qab = q && (q.abgaenge || []).find(a => a.id === v.quelle.abgangId);
    const nr = qab ? q.abgaenge.indexOf(qab) + 1 : null;
    zuSicherung = qab ? qab.sicherung : null;
    zuArt = qab ? qab.art : null;
    kopf.push(q ? q.name + " · Abgang " + nr : "Quelle unbekannt");
    if (zuArt) kopf.push(zuArt);
  } else {
    const z = v.zuleitung || {};
    zuSicherung = z.sicherung;
    kopf.push(z.herkunft || "");
  }
  const Y_EIN = 58;   // Mitte des Zeichens in der Einspeisung
  if (unterbricht(zuSicherung)){
    teile.unshift(L(X_SCHIENE, Y_EIN + K_GELENK, X_SCHIENE, letzteSchiene, 2.4));
    teile.unshift(L(X_SCHIENE, 16, X_SCHIENE, Y_EIN - K_SPITZE, 2.4));
  } else {
    teile.unshift(L(X_SCHIENE, 16, X_SCHIENE, letzteSchiene, 2.4));
  }
  teile.unshift(beschriftung(X_SCHIENE, Y_EIN, kopf[0],
    [bemessung(zuSicherung), kopf[1]].filter(Boolean).join(" · "), true));
  teile.unshift(polstrich(zuSicherung, X_SCHIENE, Y_EIN,
    polzahl(zuSicherung, zuArt || "CEE"), true));
  teile.unshift(zeichenFuer(zuSicherung, X_SCHIENE, Y_EIN, true));

  return { svg: teile.join("\n"), breite: S_NUTZ, hoehe: y + 20 };
}

/* ---- Alle Blätter eines Baums ---- */

function schaltbildBlaetter(wurzel){
  const reihenfolge = [];
  (function gehe(v, tiefe){
    if (!v || tiefe > 20) return;
    reihenfolge.push(v);
    for (const a of (v.abgaenge || [])) if (a.mobil) gehe(verteilerNach(a.mobil), tiefe+1);
  })(wurzel, 0);

  const nummerVon = (id) => reihenfolge.findIndex(v => v.id === id) + 1;
  return reihenfolge.map((v, i) => ({
    v, nr: i+1, gesamt: reihenfolge.length,
    bild: schaltbildEinerVerteiler(v, nummerVon),
  }));
}

function schaltbildHtml(wurzel){
  const blaetter = schaltbildBlaetter(wurzel);
  const heute = new Date().toLocaleDateString("de-DE",
    { day:"2-digit", month:"2-digit", year:"numeric" });

  const abschnitte = blaetter.map(b => {
    const v = b.v;
    const unter = v.art === "mobil" ? "Mobiler Verteiler" : "Verteiler";
    return `<section class="blatt">
      <div class="kopf">
        <div><span class="name">${esc(v.name)}</span><span class="art">${unter}</span></div>
        <div class="zaehler">Blatt ${b.nr} von ${b.gesamt} · Stand ${heute}</div>
      </div>
      <svg viewBox="0 0 ${b.bild.breite} ${b.bild.hoehe}" width="${b.bild.breite}" height="${b.bild.hoehe}">
        ${b.bild.svg}
      </svg>
    </section>`;
  }).join("\n");

  return `<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<title>Prinzipschaltbild</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:#000;
       font:14px/1.45 Helvetica,Arial,sans-serif;
       -webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{width:${PDF_BREITE}px;margin:0 auto}
  .bogen{width:${BG_BREITE}px;margin:0 auto;padding:28px 0 40px}
  .blatt{padding:0 ${S_RAND}px;margin-bottom:26px;page-break-inside:avoid;break-inside:avoid}
  .kopf{display:flex;align-items:baseline;justify-content:space-between;
        border-bottom:1px solid #000;padding-bottom:5px;margin-bottom:10px}
  .kopf .name{font-size:16px;font-weight:700}
  .kopf .art{font-size:12.5px;color:#333;margin-left:10px}
  .kopf .zaehler{font-size:12px;color:#333}
  svg{display:block}
</style></head>
<body><div class="bogen">
  ${abschnitte}
</div></body></html>`;
}

/* 13 · Stand sichern und übernehmen                                   */
/* ================================================================== */

/* Eine Standdatei nimmt den Inhalt der Ablage mit auf ein anderes
   Gerät. Zwei Arten:
   "gesamt" – alle Pläne samt Ausschnitt, Reichweite und Bestand,
              gedacht für den Gerätewechsel; ersetzt beim Übernehmen
              alles, was da ist.
   "plan"   – ein einzelner Plan zum Weitergeben; wird beim Übernehmen
              zu dem gelegt, was schon da ist.
   Die Zeichnung liegt in Zahlenfeldern. Als Text geschrieben wäre die
   Datei ein Vielfaches so groß, deshalb wandern sie Base64-verpackt
   hinein. */

const STAND_KENNUNG = "sf-eplan-stand-v1";
const FELDARTEN = { Uint8Array, Uint32Array, Float32Array };

function b64Aus(feld){
  const bytes = new Uint8Array(feld.buffer, feld.byteOffset, feld.byteLength);
  let s = "";
  for (let i = 0; i < bytes.length; i += 0x8000)          // stückweise, sonst
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));  // reißt der Aufrufstapel
  return btoa(s);
}
function b64Nach(art, text){
  const roh = atob(text);
  const bytes = new Uint8Array(roh.length);
  for (let i = 0; i < roh.length; i++) bytes[i] = roh.charCodeAt(i);
  return new (FELDARTEN[art])(bytes.buffer);
}

const ZAHLENFELDER = ["formen","farben","starts","radien","kasten","punkte"];

function planPacken(p){
  const aus = Object.assign({}, p);
  for (const name of ZAHLENFELDER){
    const f = p[name];
    if (f && f.buffer) aus[name] = { feld: f.constructor.name, b64: b64Aus(f) };
  }
  return aus;
}
function planEntpacken(p){
  const aus = Object.assign({}, p);
  for (const name of ZAHLENFELDER){
    const f = p[name];
    if (f && f.b64 !== undefined && FELDARTEN[f.feld]) aus[name] = b64Nach(f.feld, f.b64);
  }
  return aus;
}

function standDateiname(stand, name){
  const d = new Date(stand.erstellt);
  const zz = (n) => String(n).padStart(2, "0");
  const datum = zz(d.getFullYear() % 100) + "-" + zz(d.getMonth()+1) + "-" + zz(d.getDate());
  /* Die Endung .json bleibt hinten, damit die Dateien-App auf dem
     iPhone die Datei kennt und die Auswahl sie nicht ausgraut. */
  return datum + " " + name + ".sfeplan.json";
}

async function standTeilen(text, dateiname){
  const datei = new File([text], dateiname, { type:"application/json" });
  try{
    if (navigator.canShare && navigator.canShare({ files:[datei] })){
      await navigator.share({ files:[datei] });   // ohne Titel, sonst kommt ein Textobjekt mit
    } else {
      const url = URL.createObjectURL(datei);
      const a = document.createElement("a");
      a.href = url; a.download = dateiname; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }
  }catch(e){
    /* iOS meldet beim Teilen fälschlich einen Abbruch. */
  }
}

/* nurPlan: Kennung eines Plans, sonst der ganze Stand */
async function standSichern(nurPlan){
  const alle = (await alleHolen()) || [];
  const plaene = nurPlan ? alle.filter(p => p.id === nurPlan) : alle;
  if (!plaene.length) return hinweis("Nichts zu sichern", "Es liegt kein Plan in der Ablage.");

  arbeitAn("Packe den Stand …");
  await naechsterRahmen();
  try{
    const stand = {
      kennung: STAND_KENNUNG,
      art: nurPlan ? "plan" : "gesamt",
      erstellt: Date.now(),
      fassung: FASSUNG,
      plaene: plaene.map(planPacken),
    };
    if (!nurPlan){
      stand.einstellungen = {
        ausschnitt: await ausschnittHolen(),
        reichweite: await reichweiteHolen(),
        bestand:    await bestandHolen(),
      };
    }
    const text = JSON.stringify(stand);
    const name = standDateiname(stand, nurPlan ? plaene[0].name : "SF E-Plan Stand");
    arbeitAus();
    await standTeilen(text, name);
  }catch(e){
    arbeitAus();
    await hinweis("Sichern misslungen", String(e && e.message || e));
  }
}

async function standUebernehmen(){
  const f = await dateiWaehlen(".sfeplan,.json,application/json");
  if (!f) return;
  arbeitAn("Lese die Standdatei …");
  await naechsterRahmen();

  let stand;
  try{ stand = JSON.parse(await f.text()); }
  catch(e){ arbeitAus(); return hinweis("Nicht lesbar", "Die Datei ließ sich nicht auswerten."); }
  if (!stand || stand.kennung !== STAND_KENNUNG || !Array.isArray(stand.plaene)){
    arbeitAus();
    return hinweis("Keine Standdatei",
      "Diese Datei stammt nicht aus SF E-Plan. Zeichnungen liest du über „Plan einlesen“ ein.");
  }
  arbeitAus();

  const vorhanden = (await alleHolen()) || [];
  const anzahl = stand.plaene.length;
  const wieViele = anzahl === 1 ? "1 Plan" : anzahl + " Pläne";

  if (stand.art === "gesamt"){
    const a = await frage({
      titel: "Stand übernehmen",
      text: wieViele + " aus der Datei" +
            (vorhanden.length
              ? ". Alles, was jetzt auf diesem Gerät liegt, wird dabei ersetzt: " +
                (vorhanden.length === 1 ? "1 Plan" : vorhanden.length + " Pläne") +
                " samt Verteilern, Ausschnitt und Bestand."
              : "."),
      knoepfe: [{ text:"Übernehmen und ersetzen", wert:true, art: vorhanden.length ? "gefahr" : "" },
                { text:"Abbrechen", wert:false, art:"leer" }],
    });
    if (!a.wahl) return;

    arbeitAn("Übernehme den Stand …");
    await naechsterRahmen();
    for (const p of vorhanden) await planLoeschen(p.id);
    for (const p of stand.plaene) await planSpeichern(planEntpacken(p));
    const e = stand.einstellungen || {};
    AUSSCHNITT = e.ausschnitt || null;
    await ausschnittSpeichern(AUSSCHNITT);
    if (typeof e.reichweite === "number"){ REICHWEITE = e.reichweite; await reichweiteSpeichern(REICHWEITE); }
    if (Array.isArray(e.bestand)) await bestandSpeichern(e.bestand);
    arbeitAus();
    await listeZeichnen();
    return hinweis("Stand übernommen", wieViele + " und die Einstellungen liegen jetzt auf diesem Gerät.");
  }

  /* Einzelner Plan: er kommt zu dem, was schon da ist. */
  const p = stand.plaene[0];
  const schon = vorhanden.find(x => x.id === p.id);
  if (schon){
    const a = await frage({
      titel: "Plan schon vorhanden",
      text: "„" + schon.name + "“ liegt bereits auf diesem Gerät. Die Fassung aus der Datei kann ihn " +
            "ersetzen oder als zweiter Plan danebengelegt werden.",
      knoepfe: [{ text:"Ersetzen", wert:"ersetzen", art:"gefahr" },
                { text:"Als Kopie ablegen", wert:"kopie", art:"leer" },
                { text:"Abbrechen", wert:null, art:"leer" }],
    });
    if (!a.wahl) return;
    if (a.wahl === "kopie"){
      p.id = "plan_" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
      p.name = p.name + " (Kopie)";
    }
  }
  arbeitAn("Übernehme den Plan …");
  await naechsterRahmen();
  await planSpeichern(planEntpacken(p));
  arbeitAus();
  await listeZeichnen();
  await hinweis("Plan übernommen", "„" + p.name + "“ liegt jetzt in der Ablage.");
}

$("knopfStand").addEventListener("click", async () => {
  const a = await frage({
    titel: "Stand",
    text: "Zum Gerätewechsel den ganzen Stand sichern und auf dem neuen Gerät übernehmen. " +
          "Einen einzelnen Plan gibst du über ⋯ an der Plankarte weiter.",
    knoepfe: [{ text:"Ganzen Stand sichern", wert:"sichern" },
              { text:"Stand aus Datei übernehmen", wert:"lesen", art:"leer" },
              { text:"Abbrechen", wert:null, art:"leer" }],
  });
  if (a.wahl === "sichern") return standSichern(null);
  if (a.wahl === "lesen")   return standUebernehmen();
});

/* ================================================================== */
/* 14 · Zustandsanzeige                                                */
/* ================================================================== */

/* Die Aussetzer werfen keinen Fehler, deshalb bleibt das Fehlerband
   leer: es klemmt kein Handler, es steht ein Wert falsch. Diese Anzeige
   legt die fraglichen Werte offen und schreibt mit, was an Ereignissen
   wirklich ankommt – in der Erfassungsphase am Fenster, also bevor
   irgendein Handler der App sie zu sehen bekommt. Sie ändert nichts am
   Ablauf und nimmt selbst keine Tipps an. */

const zustandZaehler = { plan:0, flaeche:0, laufband:0, geister:0 };
let ZUSTAND_AN = false;
let zustandUhr = null;
const zustandBand = [];          // die letzten Ereignisse
let letzteZeige = null;          // pointerdown, auf den noch ein Klick fehlt

const zustandHolen = () => dbTun("readonly", s => s.get("zustand"), EINST)
  .then(e => !!(e && e.wert));
const zustandSpeichern = (wert) =>
  dbTun("readwrite", s => s.put({ id:"zustand", wert }), EINST);

const zeitText = () => {
  const d = new Date();
  return String(d.getMinutes()).padStart(2,"0") + ":" +
         String(d.getSeconds()).padStart(2,"0") + "." +
         String(Math.floor(d.getMilliseconds()/100));
};

/* 0, NaN und Unendlich sollen als das dastehen, was sie sind – gerade
   sie sind hier ja der Verdacht. */
const zahlKurz = (n) =>
  (typeof n === "number" && isFinite(n) && n !== 0) ? n.toPrecision(4) : String(n);

/* Kurzname eines Elements: die eigene Kennung, sonst die des nächsten
   Vorfahren mit einer, sonst Name und erste Klasse. */
function kurz(el){
  if (!el) return "–";
  if (el.id) return "#" + el.id;
  const oben = el.closest ? el.closest("[id]") : null;
  const name = (el.tagName || "?").toLowerCase();
  if (oben) return name + "<#" + oben.id;
  const k = (typeof el.className === "string" && el.className.trim().split(/\s+/)[0]) || "";
  return k ? name + "." + k : name;
}

function bandZeile(text){
  zustandBand.push(zeitText() + " " + text);
  while (zustandBand.length > 6) zustandBand.shift();
  zustandMalen();
}

function ereignisNotieren(kurzzeichen, ev){
  const ziel = ev.target;
  let t = kurzzeichen + " " + kurz(ziel);
  if (typeof ev.clientX === "number" && ev.clientX !== undefined){
    const x = Math.round(ev.clientX), y = Math.round(ev.clientY);
    t += " " + x + "," + y;
    const drunter = document.elementFromPoint(x, y);
    if (drunter !== ziel) t += " ⇒" + kurz(drunter);
  }
  if (ev.pointerId !== undefined) t += " №" + ev.pointerId;
  bandZeile(t);
}

/* Ereignisse am Fenster, Erfassungsphase: so wird auch mitgeschrieben,
   was nie bei einem Handler der App ankommt. */
["pointerdown","pointerup","pointercancel","lostpointercapture","click"].forEach(art => {
  window.addEventListener(art, ev => {
    if (!ZUSTAND_AN) return;
    if (art === "pointerdown"){
      letzteZeige = { knopf: ev.target && ev.target.closest && ev.target.closest("button"),
                      klick:false };
      ereignisNotieren("↓", ev);
    } else if (art === "click"){
      if (letzteZeige) letzteZeige.klick = true;
      ereignisNotieren("✓", ev);
    } else if (art === "pointerup"){
      ereignisNotieren("↑", ev);
      const z = letzteZeige;
      /* Ein Knopf, auf den gedrückt und losgelassen wurde, muss einen
         Klick nach sich ziehen. Bleibt der aus, steht es hier. */
      setTimeout(() => {
        if (z && !z.klick && z.knopf) bandZeile("! kein Klick auf " + kurz(z.knopf));
      }, 500);
    } else {
      ereignisNotieren(art === "pointercancel" ? "✕" : "⊘", ev);
    }
  }, true);
});

/* Bewegung, obwohl kein Finger aufliegt: der Zustand aus einer früheren
   Geste steht dann noch. Wird nur gezählt, sonst liefe das Band über. */
window.addEventListener("pointermove", () => {
  if (ZUSTAND_AN && zieht && zeiger.size === 0) zustandZaehler.geister++;
}, true);

/* Nur die Seite selbst, nicht die Listen darin – sonst überschwemmt
   jedes Wischen in einer Liste das Band. */
window.addEventListener("scroll", ev => {
  if (!ZUSTAND_AN) return;
  const z = ev.target;
  if (z !== document && z !== document.documentElement && z !== document.body) return;
  bandZeile("↕ Seite " + Math.round(window.scrollX) + "," + Math.round(window.scrollY));
}, true);

if (window.visualViewport)
  window.visualViewport.addEventListener("resize", () => {
    if (!ZUSTAND_AN) return;
    const v = window.visualViewport;
    bandZeile("⤢ Sichtfenster h=" + Math.round(v.height) +
              " top=" + Math.round(v.offsetTop) + " z=" + v.scale.toFixed(2));
  });

let vorherPlan = 0, vorherFlaeche = 0, vorherZeit = 0, planJeSek = 0, flaecheJeSek = 0;

function zustandZeilen(){
  const rahmen = $("leinwandRahmen").getBoundingClientRect();
  const zr = $("knopfMenue").getBoundingClientRect();
  const vv = window.visualViewport;
  const schirm = document.querySelector(".schirm.an");
  const deckel = [
    $("schleier").classList.contains("an") ? "Fenster" : null,
    $("menueSchleier").hidden ? null : "Menü",
    $("suchschirm").hidden ? null : "Suche",
    $("arbeit").classList.contains("an") ? "Arbeit" : null,
  ].filter(Boolean);

  const modus = verteilerModus ? "Verteiler" : zuschneiden ? "Zuschnitt"
              : ortWahl ? "Ortwahl" : "–";

  const zeilen = [
    FASSUNG + " · " + (schirm ? schirm.id : "kein Schirm") +
      " · Deckel " + (deckel.length ? deckel.join("+") : "–"),
    "Geste zieht=" + (zieht?1:0) + " bewegt=" + (bewegt?1:0) +
      " inBew=" + (inBewegung?1:0) + " lang=" + (langAusgeloest?1:0) +
      (langUhr ? "+Uhr" : "") + " Ziel=" + (ziehZiel ? (ziehArt||"?") : "–") +
      " Geister=" + zustandZaehler.geister,
    "Finger " + zeiger.size + " [" + [...zeiger.keys()].join(",") + "]" +
      " kneif=" + Math.round(kneifAbstand) +
      " letzt=" + Math.round(letzterX) + "," + Math.round(letzterY),
    "Sicht m=" + zahlKurz(sicht.m) + " basis=" + zahlKurz(basisM) +
      " x=" + Math.round(sicht.x) + " y=" + Math.round(sicht.y),
    "Leinwand " + leinwand.width + "×" + leinwand.height +
      " Rahmen " + Math.round(rahmen.width) + "×" + Math.round(rahmen.height) +
      " dpr " + (window.devicePixelRatio || 1),
    "Seite " + Math.round(window.scrollX) + "," + Math.round(window.scrollY) +
      " behoben " + versatzZaehler + " · Schirm " + sichtHoehe +
      (vv ? " · Sichtfenster " + Math.round(vv.width) + "×" + Math.round(vv.height) +
            " top=" + Math.round(vv.offsetTop) + " z=" + vv.scale.toFixed(2) : ""),
    "Zahnrad " + Math.round(zr.left) + "," + Math.round(zr.top) +
      " " + Math.round(zr.width) + "×" + Math.round(zr.height) +
      (($("knopfMenue").hidden) ? " (verborgen)" : ""),
    "Modus " + modus + " · mark " + (markiert ? markiert.art : "–") +
      " · herv " + (hervorhebung ? hervorhebung.art : "–") +
      " · Bänder " + zustandZaehler.laufband,
    "Gerät " + screen.width + "×" + screen.height +
      " frei " + screen.availWidth + "×" + screen.availHeight +
      " · Wurzel " + document.documentElement.clientHeight +
      " · Fenster " + window.innerHeight,
    "Bilder Plan " + planJeSek + "/s Fläche " + flaecheJeSek + "/s" +
      " · Auftrag " + (zeichenAuftrag ? 1 : 0) + " · Tippuhr " + (tippUhr ? 1 : 0),
  ];
  if (fehlerZahl) zeilen.push("Fehler " + fehlerZahl + " · zuletzt: " + letzterFehler);
  return zeilen;
}

function zustandMalen(){
  if (!ZUSTAND_AN) return;
  const feld = $("zustand");
  feld.textContent = zustandZeilen().join("\n");
  const band = document.createElement("span");
  band.className = "band";
  band.textContent = zustandBand.length ? zustandBand.join("\n") : "(noch keine Ereignisse)";
  feld.appendChild(band);
}

function zustandSchritt(){
  const jetzt = performance.now();
  if (jetzt - vorherZeit >= 1000){
    const anteil = (jetzt - vorherZeit) / 1000;
    planJeSek = Math.round((zustandZaehler.plan - vorherPlan) / anteil);
    flaecheJeSek = Math.round((zustandZaehler.flaeche - vorherFlaeche) / anteil);
    vorherPlan = zustandZaehler.plan;
    vorherFlaeche = zustandZaehler.flaeche;
    vorherZeit = jetzt;
  }
  zustandMalen();
}

function zustandSchalten(an, merken){
  ZUSTAND_AN = !!an;
  $("zustand").hidden = !ZUSTAND_AN;
  if (zustandUhr){ clearInterval(zustandUhr); zustandUhr = null; }
  if (ZUSTAND_AN){
    vorherZeit = performance.now();
    vorherPlan = zustandZaehler.plan;
    vorherFlaeche = zustandZaehler.flaeche;
    zustandMalen();
    zustandUhr = setInterval(zustandSchritt, 200);
  }
  if (merken !== false) zustandSpeichern(ZUSTAND_AN);
}

/* Ab hier steht das Band bereit. Ein Fehler, der schon vorher aufgetreten
   ist, wird einmal nachgetragen. */
zustandBereit = true;
if (fehlerZahl) bandZeile("⚠ " + letzterFehler);

/* ================================================================== */
/* 15 · Wächter gegen den Seitenversatz                                */
/* ================================================================== */

/* Gemessen am 03.09.2026: Sichtfenster 912 hoch, Seite 844, Versatz
   −68. Alles lag um diese 68 Punkte neben seiner Tippfläche, jeder
   Knopf war tot, und kein Fehler meldete sich. Die Seite darf nie
   verschoben stehen – sie kann gar nichts anzeigen, was durch Scrollen
   erreichbar wäre. Also wird jeder Versatz sofort zurückgenommen, egal
   woher er kommt. Das Sichtfenster selbst bleibt unberührt: dessen
   Versatz gehört der Tastatur und ist gewollt. */

let versatzZaehler = 0;

function seiteZurueck(woher){
  const sx = Math.round(window.scrollX || 0), sy = Math.round(window.scrollY || 0);
  if (!sx && !sy) return false;
  window.scrollTo(0, 0);
  versatzZaehler++;
  if (ZUSTAND_AN){
    const vv = window.visualViewport;
    bandZeile("⚑ Versatz " + woher + " " + sx + "," + sy +
              (vv ? " vv top=" + Math.round(vv.offsetTop) : "") +
              " → " + Math.round(window.scrollX) + "," + Math.round(window.scrollY));
  }
  return true;
}

/* Die Seite scrollt: der einzige Anlass, bei dem der Versatz überhaupt
   entsteht. Innere Kästen sind hier nicht gemeint. */
window.addEventListener("scroll", ev => {
  const z = ev.target;
  if (z === document || z === document.documentElement || z === document.body || z === window)
    seiteZurueck("Scrollen");
}, true);

/* Die Tastatur geht auf oder zu, das Sichtfenster verschiebt sich. */
if (window.visualViewport){
  window.visualViewport.addEventListener("scroll", () => seiteZurueck("Sichtfenster"));
  window.visualViewport.addEventListener("resize", () => seiteZurueck("Sichtfenster"));
}

/* Ein Eingabefeld gibt die Schreibmarke ab. */
window.addEventListener("focusout", () => setTimeout(() => seiteZurueck("Eingabe"), 120), true);

/* Letzte Sicherung: vor jeder Berührung nachsehen. Bleibt trotz allem
   ein Versatz stehen, kostet er dann höchstens noch einen Tipp. */
window.addEventListener("pointerdown", () => seiteZurueck("Berührung"), true);

/* ================================================================== */
/* 16 · Sichtbare Höhe                                                 */
/* ================================================================== */

/* Der weiße Streifen unten. Die Bildschirme hängen an dem Bereich, den
   die Seite für den Bildschirm hält; der war hier 68 Punkte kürzer als
   das, was tatsächlich zu sehen ist. Diese 68 Punkte blieben unbedeckt
   und zeigten den weißen Grund – dieselben 68, um die auch die Tipps
   danebenlagen.

   Genommen wird der größere der beiden Werte. Ist der Bereich der Seite
   schon richtig, sind beide gleich und es ändert sich nichts. Ist er zu
   kurz, gilt die sichtbare Höhe. Und weil die Tastatur nur das
   Sichtfenster schrumpfen lässt, innerHeight aber nicht, quetscht sie
   beim Tippen nichts zusammen. */

let sichtHoehe = 0;

function sichtHoeheSetzen(){
  const vv = window.visualViewport;
  const h = Math.round(Math.max(vv ? vv.height : 0, window.innerHeight || 0));
  if (!h || h === sichtHoehe) return;
  sichtHoehe = h;
  document.documentElement.style.setProperty("--sicht", h + "px");
  /* Die Leinwand misst ihren Rahmen selbst nach; sie muss das nach der
     neuen Höhe tun, nicht davor. */
  groesseNachfuehren();
  if (ZUSTAND_AN) bandZeile("▭ Höhe " + h);
}

if (window.visualViewport)
  window.visualViewport.addEventListener("resize", sichtHoeheSetzen);
window.addEventListener("resize", sichtHoeheSetzen);
window.addEventListener("orientationchange", () => setTimeout(sichtHoeheSetzen, 120));

sichtHoeheSetzen();

/* ================================================================== */

listeZeichnen();
zustandHolen().then(an => { if (an) zustandSchalten(true, false); });
</script>

</html>
