async function ortSetzen(sx, sy){
  const uv = verteilerListe().find(v => v.id === ortWahl.uvId);
  const ab = uv && uv.abgaenge.find(a => a.id === ortWahl.abgangId);
  if (!ab) return ortWahlBeenden();

  const mobilerZweck = ortWahl.zweck === "mobil";
  const n = PLAN.nullpunkt;
  const treffer = mobilerZweck ? null : standortUnter(sx, sy);
  const p = treffer ? { x:treffer.x + n.x, y:treffer.y + n.y } : schirmZuZeichnung(sx, sy);

  if (!imBereich(p, setzGrenze())){
    return hinweis("Außerhalb des Ausschnitts",
      "Es lässt sich nur innerhalb des festgelegten Ausschnitts verorten.");
  }
  if (mobilerZweck){
    const ziel = verteilerListe().find(v => v.id === ortWahl.zielId);
    if (!ziel) return ortWahlBeenden();
    ziel.x = p.x; ziel.y = p.y;
    await planSpeichern(PLAN);
    return ortWahlBeenden(ziel.id);
  }
  if (!ab.verbraucher) return ortWahlBeenden();
  ab.verbraucher.x = p.x;
  ab.verbraucher.y = p.y;
  ab.verbraucher.standort = treffer ? treffer.nr : null;
  ab.verbraucher.standnummer = treffer ? standortBezeichnung(treffer) : null;
  ab.verbraucher.ortVeraltet = false;
  await planSpeichern(PLAN);
  ortWahlBeenden();
}

/* ---- Hervorhebung ---- */

const oberflaeche = $("oberflaeche");
const octx = oberflaeche.getContext("2d");
let hervorhebung = null;   // {art:"verbraucher"|"verteiler", uvId, abgangId?}
let laufband = 0;
let laufbandLaeuft = false;
let pulsZiel = null;   // Ziel des letzten Suchsprungs, in Zeichnungskoordinaten
let pulsZeit = 0;
let markiert = null;   // {art, uvId, abgangId?} – markiertes Objekt, verschiebbar
const ruhigeAnzeige = window.matchMedia
  && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const hatOrt = (o) => o && o.x !== null && o.x !== undefined && o.y !== null && o.y !== undefined;
const verteilerNach = (id) => verteilerListe().find(x => x.id === id);

/* Kette nach oben: vom Verteiler bis zur festen Einspeisung. */
function aufwaerts(uvId){
  const kette = [];
  let id = uvId, schutz = 0;
  while (id && schutz++ < 30){
    const v = verteilerNach(id);
    if (!v) break;
    kette.push(v);
    id = (v.art === "mobil" && v.quelle) ? v.quelle.uvId : null;
  }
  return kette;   // [eigener, …, feste Einspeisung]
}

/* Alles, was unterhalb eines Verteilers hängt. */
function abwaerts(v, ergebnis, tiefe){
  if (!v || tiefe > 30) return;
  ergebnis.knoten.push(v);
  for (const ab of (v.abgaenge || [])){
    if (ab.mobil){
      const m = verteilerNach(ab.mobil);
      if (m){
        if (hatOrt(v) && hatOrt(m)) ergebnis.strecken.push({ a:v, b:m });
        abwaerts(m, ergebnis, tiefe+1);
      }
    } else if (ab.verbraucher){
      ergebnis.verbraucher.push(ab.verbraucher);
      if (hatOrt(v) && hatOrt(ab.verbraucher)) ergebnis.strecken.push({ a:v, b:ab.verbraucher });
    }
  }
}

/* Baut Strecken und Knoten der aktuellen Hervorhebung. */
function hervorhebungBauen(){
  if (!hervorhebung) return null;
  const v = verteilerNach(hervorhebung.uvId);
  if (!v) return null;
  const ergebnis = { strecken:[], knoten:[], verbraucher:[], kopf:v };

  if (hervorhebung.art === "verbraucher"){
    const ab = (v.abgaenge || []).find(a => a.id === hervorhebung.abgangId);
    if (!ab || !ab.verbraucher) return null;
    const kette = aufwaerts(v.id).reverse();          // Einspeisung zuerst
    for (let i=0;i<kette.length-1;i++)
      if (hatOrt(kette[i]) && hatOrt(kette[i+1]))
        ergebnis.strecken.push({ a:kette[i], b:kette[i+1] });
    if (hatOrt(v) && hatOrt(ab.verbraucher))
      ergebnis.strecken.push({ a:v, b:ab.verbraucher });
    ergebnis.knoten = kette;
    ergebnis.verbraucher = [ab.verbraucher];
    ergebnis.abgang = ab;
    return ergebnis;
  }

  // Verteiler: alles darunter, bei einem mobilen zusätzlich die Zuleitung
  if (v.art === "mobil"){
    const kette = aufwaerts(v.id).reverse();
    for (let i=0;i<kette.length-1;i++)
      if (hatOrt(kette[i]) && hatOrt(kette[i+1]))
        ergebnis.strecken.push({ a:kette[i], b:kette[i+1] });
    ergebnis.knoten.push(...kette.slice(0,-1));       // der eigene kommt gleich dazu
  }
  abwaerts(v, ergebnis, 0);
  return ergebnis;
}

function verbraucherUnter(sx, sy){
  const n = PLAN.nullpunkt;
  let beste = null, nah = 16;
  for (const { v, a, b } of alleVerbraucher()){
    const x = sicht.x + (b.x-n.x)*sicht.m, y = sicht.y - (b.y-n.y)*sicht.m;
    const d = Math.hypot(x-sx, y-sy);
    if (d < nah){ nah = d; beste = { art:"verbraucher", uvId:v.id, abgangId:a.id }; }
  }
  return beste;
}

/* Verteiler haben Vorrang, weil ihre Marke größer und gezielter ist. */
function objektUnter(sx, sy){
  const uv = verteilerUnter(sx, sy);
  if (uv) return { art:"verteiler", uvId:uv.id };
  return verbraucherUnter(sx, sy);
}

/* Das bewegliche Objekt hinter einer Wahl. */
function objektVon(wahl){
  if (!wahl) return null;
  const v = verteilerNach(wahl.uvId);
  if (!v) return null;
  if (wahl.art === "verteiler") return v;
  const ab = (v.abgaenge || []).find(a => a.id === wahl.abgangId);
  return (ab && ab.verbraucher) || null;
}

function markiertSetzen(wahl){
  markiert = wahl;
  const st = $("streifen");
  if (!wahl){
    if (!verteilerModus && !zuschneiden && !ortWahl && !hervorhebung) st.hidden = true;
    oberflaecheZeichnen();
    return;
  }
  const v = verteilerNach(wahl.uvId);
  const o = objektVon(wahl);
  const name = wahl.art === "verteiler"
    ? (v ? v.name : "Verteiler")
    : ((o && o.name) || "Verbraucher");
  st.textContent = name + " markiert · ziehen verschiebt · tippen hebt auf";
  st.hidden = false;
  oberflaecheZeichnen();
}

/* Nach dem Verschieben eines Verbrauchers die Bindung an einen
   Standort neu bestimmen – dieselbe Regel wie beim Setzen. */
function verbraucherNeuBinden(b){
  const n = PLAN.nullpunkt;
  let beste = null, nah = EINRAST / Math.max(sicht.m, 1e-6);
  for (const s of standorteAktiv(PLAN)){
    const d = Math.hypot((s.x + n.x) - b.x, (s.y + n.y) - b.y);
    if (d < nah){ nah = d; beste = s; }
  }
  if (beste){
    b.x = beste.x + n.x; b.y = beste.y + n.y;
    b.standort = beste.nr;
    b.standnummer = standortBezeichnung(beste);
  } else {
    b.standort = null;
    b.standnummer = null;
  }
  b.ortVeraltet = false;
}

const gleicheWahl = (a, b) => a && b && a.art === b.art && a.uvId === b.uvId &&
                              (a.abgangId || null) === (b.abgangId || null);

function hervorhebungWaehlen(wahl){
  hervorhebung = wahl;
  const st = $("streifen");
  if (!wahl){
    if (!verteilerModus && !zuschneiden && !ortWahl) st.hidden = true;
    laufbandLaeuft = false;
    oberflaecheZeichnen();
    return;
  }
  const daten = hervorhebungBauen();
  if (!daten){ hervorhebung = null; return; }

  if (wahl.art === "verbraucher"){
    const kette = aufwaerts(daten.kopf.id);
    const weg = kette.slice().reverse().map((k, i) => {
      if (i === 0) return k.name;
      const eltern = kette[kette.length - i];
      const q = k.quelle && (eltern.abgaenge || []).findIndex(a => a.id === k.quelle.abgangId);
      return (q >= 0 ? "Abg. " + (q+1) + " → " : "") + k.name;
    }).join(" · ");
    const nr = daten.kopf.abgaenge.indexOf(daten.abgang) + 1;
    st.textContent = (daten.abgang.verbraucher.name || "Verbraucher") +
                     " ← " + weg + " · Abg. " + nr;
  } else {
    const mobile = daten.knoten.filter(k => k.art === "mobil" && k.id !== daten.kopf.id).length;
    const teile = [];
    teile.push(daten.verbraucher.length === 1 ? "1 Verbraucher" : daten.verbraucher.length + " Verbraucher");
    if (mobile) teile.push(mobile === 1 ? "1 mobiler Verteiler" : mobile + " mobile Verteiler");
    st.textContent = daten.kopf.name + " · " + teile.join(", ");
  }
  st.hidden = false;
  laufbandStarten();
  oberflaecheZeichnen();
}

function laufbandStarten(){
  if (laufbandLaeuft || ruhigeAnzeige) return;
  laufbandLaeuft = true;
  zustandZaehler.laufband++;
  let zuletzt = performance.now();
  const schritt = (jetzt) => {
    if (!laufbandLaeuft || !(hervorhebung || pulsZiel)){
      laufbandLaeuft = false; zustandZaehler.laufband--; return;
    }
    const d = jetzt - zuletzt;
    laufband += d * 0.03;    // rund 30 Bildpunkte je Sekunde
    pulsZeit += d;
    zuletzt = jetzt;
    oberflaecheZeichnen();
    requestAnimationFrame(schritt);
  };
  requestAnimationFrame(schritt);
}

/* Nach einem Sprung aus der Suche pulsiert eine Aura um das Ziel,
   bis irgendwo im Plan getippt wird. */
const PULS_DAUER = 1500;   // Millisekunden je Welle
function pulsSetzen(punktAbsolut){
  pulsZiel = punktAbsolut ? { x:punktAbsolut.x, y:punktAbsolut.y } : null;
  pulsZeit = 0;
  if (pulsZiel) laufbandStarten(); else oberflaecheZeichnen();
}
function pulsZeichnen(){
  if (!pulsZiel) return;
  const n = PLAN.nullpunkt;
  const x = sicht.x + (pulsZiel.x-n.x)*sicht.m;
  const y = sicht.y - (pulsZiel.y-n.y)*sicht.m;

  for (const versatz of [0, 0.5]){
    const t = ((pulsZeit / PULS_DAUER) + versatz) % 1;
    const r = 14 + t*36;
    const deckung = 0.5 * (1 - t) * (1 - t);
    octx.beginPath();
    octx.arc(x, y, r, 0, Math.PI*2);
    octx.strokeStyle = "rgba(23,114,107," + deckung.toFixed(3) + ")";
    octx.lineWidth = 3;
    octx.stroke();
  }
  // ruhiger Schein direkt am Objekt
  const puls = 0.10 + 0.10 * (0.5 + 0.5*Math.cos(2*Math.PI * (pulsZeit/PULS_DAUER)));
  octx.beginPath();
  octx.arc(x, y, 15, 0, Math.PI*2);
  octx.fillStyle = "rgba(23,114,107," + puls.toFixed(3) + ")";
  octx.fill();
}

/* Das markierte Objekt bekommt einen gestrichelten Ring – ruhig, damit
   er nicht mit den laufenden Linien des Versorgungswegs verwechselt wird. */
function markierungZeichnen(){
  if (!markiert) return;
  const o = objektVon(markiert);
  if (!hatOrt(o)) return;
  const n = PLAN.nullpunkt;
  const x = sicht.x + (o.x-n.x)*sicht.m, y = sicht.y - (o.y-n.y)*sicht.m;
  const r = markiert.art === "verteiler" ? 22 : 16;
  octx.setLineDash([]);
  octx.beginPath(); octx.arc(x, y, r, 0, Math.PI*2);
  octx.strokeStyle = "rgba(255,255,255,.9)"; octx.lineWidth = 6; octx.stroke();
  octx.setLineDash([6,5]);
  octx.strokeStyle = "#17726B"; octx.lineWidth = 2.5; octx.stroke();
  octx.setLineDash([]);
}

function oberflaecheZeichnen(){
  zustandZaehler.flaeche++;
  const r = $("leinwandRahmen").getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  octx.setTransform(1,0,0,1,0,0);
  octx.clearRect(0, 0, oberflaeche.width, oberflaeche.height);
  if (!PLAN) return;
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  pulsZeichnen();
  markierungZeichnen();
  if (!hervorhebung) return;

  const daten = hervorhebungBauen();
  if (!daten) return;

  const n = PLAN.nullpunkt;
  const auf = (o) => ({ x: sicht.x + (o.x-n.x)*sicht.m, y: sicht.y - (o.y-n.y)*sicht.m });
  octx.lineCap = "round";

  for (const st of daten.strecken){
    const a = auf(st.a), b = auf(st.b);
    octx.beginPath(); octx.moveTo(a.x, a.y); octx.lineTo(b.x, b.y);
    octx.setLineDash([]);
    octx.strokeStyle = "rgba(255,255,255,.85)"; octx.lineWidth = 6; octx.stroke();
    octx.setLineDash([9,7]);
    octx.lineDashOffset = -laufband;
    octx.strokeStyle = "#17726B"; octx.lineWidth = 3; octx.stroke();
  }
  octx.setLineDash([]);

  for (const k of daten.knoten){
    if (!hatOrt(k)) continue;
    const p = auf(k);
    const stark = k.id === daten.kopf.id;
    octx.beginPath(); octx.arc(p.x, p.y, stark ? 19 : 17, 0, Math.PI*2);
    octx.strokeStyle = "rgba(255,255,255,.9)"; octx.lineWidth = stark ? 6 : 5; octx.stroke();
    octx.strokeStyle = "#17726B"; octx.lineWidth = stark ? 3.5 : 2.5; octx.stroke();
  }

  for (const b of daten.verbraucher){
    if (!hatOrt(b)) continue;
    const p = auf(b);
    octx.beginPath(); octx.arc(p.x, p.y, 13, 0, Math.PI*2);
    octx.strokeStyle = "rgba(255,255,255,.9)"; octx.lineWidth = 6; octx.stroke();
    octx.strokeStyle = "#17726B"; octx.lineWidth = 3; octx.stroke();
  }
}

/* ---- Verschieben und Zoomen ---- */
let zieht = false, letzterX = 0, letzterY = 0, ankerX = 0, ankerY = 0;
let bewegt = false, ziehZiel = null, ziehArt = null;
const zeiger = new Map();
const TIPP_SCHWELLE = 6;   // darunter gilt es als Tippen, nicht als Ziehen
const DOPPEL_FENSTER = 320;   // Millisekunden zwischen zwei Tipps
let letzterTippZeit = 0, letzterTippWahl = null;
let tippUhr = null;   // wartende Hervorhebung, damit beim Doppeltipp nichts aufblitzt
function tippUhrAbbrechen(){ if (tippUhr){ clearTimeout(tippUhr); tippUhr = null; } }
const LANGE_DAUER = 500;   // Millisekunden bis zum langen Druck
let langUhr = null, langAusgeloest = false;
function langAbbrechen(){ if (langUhr){ clearTimeout(langUhr); langUhr = null; } }
function markierungLoeschen(){
  const a = window.getSelection && window.getSelection();
  if (a && a.removeAllRanges) a.removeAllRanges();
}

/* Zustand der Zwei-Finger-Geste. Wird bei jeder Änderung der Fingerzahl
   neu gesetzt, sonst rechnet der nächste Impuls mit einer Lage von vorher
   und das Bild springt. */
let kneifAbstand = 0, kneifMitte = null;

const zeigerImRahmen = (r) =>
  [...zeiger.values()].map(p => ({ x:p.x - r.left, y:p.y - r.top }));

function gesteNeuSetzen(r){
  const pk = zeigerImRahmen(r);
  if (pk.length >= 2){
    kneifAbstand = Math.hypot(pk[0].x-pk[1].x, pk[0].y-pk[1].y);
    kneifMitte = { x:(pk[0].x+pk[1].x)/2, y:(pk[0].y+pk[1].y)/2 };
  } else {
    kneifAbstand = 0; kneifMitte = null;
  }
  if (pk.length === 1){                 // Bezug fürs Verschieben nachziehen
    letzterX = pk[0].x + r.left;
    letzterY = pk[0].y + r.top;
  }
}

/* Vergrößerung begrenzen, damit man sich nicht verliert. */
function vergroesserungBegrenzen(){
  if (!basisM) return;
  sicht.m = Math.max(basisM*0.3, Math.min(basisM*400, sicht.m));
}

/* Um einen Punkt zoomen: der Weltpunkt unter "von" liegt danach unter "nach". */
function zoomen(f, von, nach){
  const vorher = sicht.m;
  sicht.m *= f;
  vergroesserungBegrenzen();
  const wirklich = sicht.m / vorher;
  sicht.x = nach.x - (von.x - sicht.x) * wirklich;
  sicht.y = nach.y + (sicht.y - von.y) * wirklich;
}

/* Nur einmal je Bild zeichnen, nicht je Fingerimpuls. */
let zeichenAuftrag = false;
function neuZeichnen(){
  if (zeichenAuftrag) return;
  zeichenAuftrag = true;
  requestAnimationFrame(() => { zeichenAuftrag = false; zeichne(); });
}

leinwand.addEventListener("pointerdown", ev => {
  leinwand.setPointerCapture(ev.pointerId);
  const r = $("leinwandRahmen").getBoundingClientRect();
  if (zuschneiden){
    ankerX = ev.clientX - r.left; ankerY = ev.clientY - r.top;
    auswahl = { x0:ankerX, y0:ankerY, x1:ankerX, y1:ankerY };
    zieht = true;
    return;
  }
  zeiger.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });
  zieht = true;
  bewegt = false; ziehZiel = null; ziehArt = null;
  ankerX = ev.clientX - r.left; ankerY = ev.clientY - r.top;
  if (verteilerModus){ ziehZiel = verteilerUnter(ankerX, ankerY); ziehArt = "verteiler"; }
  gesteNeuSetzen(r);
  inBewegung = true;

  langAbbrechen();
  langAusgeloest = false;
  if (verteilerModus || zuschneiden || ortWahl || zeiger.size !== 1) return;

  const unterm = objektUnter(ankerX, ankerY);

  // Ein bereits markiertes Objekt lässt sich sofort ziehen.
  if (markiert && unterm && gleicheWahl(unterm, markiert)){
    ziehZiel = objektVon(markiert);
    ziehArt = markiert.art;
    return;
  }
  if (unterm && !markiert){
    langUhr = setTimeout(() => {
      langUhr = null;
      langAusgeloest = true;
      markierungLoeschen();
      pulsSetzen(null);
      tippUhrAbbrechen();
      markiertSetzen(unterm);
      ziehZiel = objektVon(unterm);
      ziehArt = unterm.art;
      bewegt = false;
      setTimeout(markierungLoeschen, 0);   // der Finger liegt noch auf
    }, LANGE_DAUER);
  }
});

leinwand.addEventListener("pointermove", ev => {
  if (!zieht) return;
  const r = $("leinwandRahmen").getBoundingClientRect();

  if (zuschneiden){
    const x = ev.clientX - r.left, y = ev.clientY - r.top;
    auswahl = { x0:Math.min(ankerX, x), y0:Math.min(ankerY, y),
                x1:Math.max(ankerX, x), y1:Math.max(ankerY, y) };
    neuZeichnen();
    return;
  }

  zeiger.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });

  if (zeiger.size >= 2){
    bewegt = true;
    langAbbrechen();
    const pk = zeigerImRahmen(r);
    const abstand = Math.hypot(pk[0].x-pk[1].x, pk[0].y-pk[1].y);
    const mitte = { x:(pk[0].x+pk[1].x)/2, y:(pk[0].y+pk[1].y)/2 };
    if (kneifAbstand > 0 && abstand > 0){
      const f = Math.max(0.5, Math.min(2, abstand / kneifAbstand));
      zoomen(f, kneifMitte, mitte);      // zoomen und zugleich mitschieben
    }
    kneifAbstand = abstand;
    kneifMitte = mitte;
    neuZeichnen();
    return;
  }

  if (Math.abs(ev.clientX - (r.left+ankerX)) > TIPP_SCHWELLE ||
      Math.abs(ev.clientY - (r.top+ankerY)) > TIPP_SCHWELLE){ bewegt = true; langAbbrechen(); }

  if (ziehZiel && bewegt && (verteilerModus || markiert)){
    const p = schirmZuZeichnung(ev.clientX - r.left, ev.clientY - r.top);
    if (imBereich(p, setzGrenze())){ ziehZiel.x = p.x; ziehZiel.y = p.y; }
    letzterX = ev.clientX; letzterY = ev.clientY;
    neuZeichnen();
    oberflaecheZeichnen();
    return;
  }

  sicht.x += ev.clientX - letzterX;
  sicht.y += ev.clientY - letzterY;
  letzterX = ev.clientX; letzterY = ev.clientY;
  neuZeichnen();
});

["pointerup","pointercancel","lostpointercapture"].forEach(n =>
  leinwand.addEventListener(n, async ev => {
    langAbbrechen();
    if (langAusgeloest){ langAusgeloest = false; zeiger.delete(ev.pointerId); return; }
    if (!zeiger.has(ev.pointerId) && !zuschneiden) return;
    zeiger.delete(ev.pointerId);
    const r = $("leinwandRahmen").getBoundingClientRect();

    if (zeiger.size){          // ein Finger liegt noch auf: Bezug neu setzen
      gesteNeuSetzen(r);
      return;
    }
    zieht = false;
    kneifAbstand = 0; kneifMitte = null;
    inBewegung = false;
    neuZeichnen();             // ohne Bewegung wieder vollständig zeichnen
    if (n !== "pointerup"){ ziehZiel = null; return; }

    if (!verteilerModus){
      if (ziehZiel && bewegt){                  // markiertes Objekt verschoben
        if (ziehArt === "verbraucher") verbraucherNeuBinden(ziehZiel);
        await planSpeichern(PLAN);
        ziehZiel = null; ziehArt = null;
        neuZeichnen();
        return;
      }
      if (!bewegt && !zuschneiden){
        const sx = ev.clientX - r.left, sy = ev.clientY - r.top;
        if (ortWahl){ ortSetzen(sx, sy); }
        else if (markiert){                     // jeder Tipp hebt die Markierung auf
          markiertSetzen(null);
          letzterTippWahl = null;               // zählt nicht als erster von zweien
        }
        else {
          const wahl = objektUnter(sx, sy);
          const jetzt = performance.now();
          const doppelt = wahl && letzterTippWahl && gleicheWahl(wahl, letzterTippWahl) &&
                          (jetzt - letzterTippZeit) < DOPPEL_FENSTER;
          letzterTippZeit = jetzt;
          letzterTippWahl = wahl;
          tippUhrAbbrechen();
          pulsSetzen(null);

          if (doppelt && wahl.art === "verteiler"){
            letzterTippWahl = null;
            const v = verteilerNach(wahl.uvId);
            if (v){
              hervorhebungWaehlen(null);   // der Doppeltipp öffnet nur, er hebt nichts hervor
              uvOeffnen(v);
              ziehZiel = null; ziehArt = null;
              return;
            }
          }

          const ziel = gleicheWahl(wahl, hervorhebung) ? null : wahl;
          if (wahl && wahl.art === "verteiler"){
            // Nur hier ist ein Doppeltipp möglich, also nur hier abwarten.
            tippUhr = setTimeout(() => { tippUhr = null; hervorhebungWaehlen(ziel); }, DOPPEL_FENSTER);
          } else {
            hervorhebungWaehlen(ziel);
          }
        }
      }
      ziehZiel = null; ziehArt = null;
      return;
    }

    if (ziehZiel && bewegt){                    // verschoben
      await planSpeichern(PLAN);
      ziehZiel = null; ziehArt = null;
      return;
    }
    if (!bewegt){                               // getippt
      const sx = ev.clientX - r.left, sy = ev.clientY - r.top;
      const treffer = verteilerUnter(sx, sy);
      if (treffer){
        gewaehlt = (gewaehlt === treffer.id) ? null : treffer.id;
        verteilerLeisteAuffrischen();
        neuZeichnen();
      } else {
        verteilerSetzen(sx, sy);
      }
    }
    ziehZiel = null; ziehArt = null;
  }));

leinwand.addEventListener("contextmenu", ev => ev.preventDefault());
leinwand.addEventListener("wheel", ev => {
  ev.preventDefault();
  const r = $("leinwandRahmen").getBoundingClientRect();
  const m = { x:ev.clientX - r.left, y:ev.clientY - r.top };
  zoomen(Math.exp(-ev.deltaY * 0.0015), m, m);
  neuZeichnen();
}, { passive:false });

const groesseNachfuehren = () => {
  if (!PLAN || !$("schirmPlan").classList.contains("an")) return;
  groesseSetzen();
  zeichne();
};
window.addEventListener("resize", groesseNachfuehren);
window.addEventListener("orientationchange", groesseNachfuehren);
if (window.visualViewport) window.visualViewport.addEventListener("resize", groesseNachfuehren);

/* ================================================================== */
/* 6 · Ein Verteiler: Zuleitung, RCD-Gruppen, Abgänge                  */
/* ================================================================== */

let UV = null;   // der geöffnete Verteiler

const neueKennung = (v) => v + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,5);

/* Reihenfolge der Abgänge ändern. Die Nummer ist die Position in der
   Liste, sie ergibt sich also von selbst neu. Verschoben wird nur
   innerhalb der eigenen Gruppe: ein Abgang hinter einem RCD tauscht mit
   dem nächsten Abgang hinter demselben RCD, ein direkter mit dem
   nächsten direkten. */
let sortModus = false;

function nachbarInGruppe(i, richtung){
  const liste = UV.abgaenge, g = liste[i].rcd || null;
  for (let k = i + richtung; k >= 0 && k < liste.length; k += richtung)
    if ((liste[k].rcd || null) === g) return k;
  return -1;
}
async function abgangVerschieben(a, richtung){
  const liste = UV.abgaenge;
  const i = liste.indexOf(a);
  if (i < 0) return;
  const k = nachbarInGruppe(i, richtung);
  if (k < 0) return;
  liste[i] = liste[k]; liste[k] = a;
  await merken();
  uvZeichnen();
}

function uvOeffnen(v){
  UV = v;
  sortModus = false;
  if (!UV.art) UV.art = "fest";
  if (UV.art !== "mobil" && !UV.zuleitung)
    UV.zuleitung = { herkunft:"", sicherung:{ art:"gG", kennlinie:null, strom:63, ma:null } };
  if (!UV.rcds) UV.rcds = [];
  if (!UV.abgaenge) UV.abgaenge = [];
  $("uvTitel").textContent = UV.name + (UV.art === "mobil" ? " · mobil" : "");
  uvZeichnen();
  schirmZeigen("schirmUV");
}
$("uvZurueck").addEventListener("click", () => {
  UV = null;
  schirmZeigen("schirmPlan");
  zeichne();
});

const merken = () => planSpeichern(PLAN);

/* Mit sortier wird die Zeile zur Ablage für zwei Pfeilknöpfe und
   selbst nicht mehr anklickbar – geschachtelte Knöpfe gäbe es sonst. */
function zeile({ nr, oben, unten, beiKlick, sortier }){
  const b = document.createElement(sortier ? "div" : "button");
  b.className = "zeile";
  b.innerHTML = (nr !== undefined ? '<span class="nr"></span>' : '') +
                '<span class="haupt"><span class="oben"></span><span class="unten"></span></span>' +
                (sortier
                  ? '<span class="sortier">' +
                    '<button class="pfeilknopf" data-weg="auf" aria-label="Nach oben">&#9650;</button>' +
                    '<button class="pfeilknopf" data-weg="ab" aria-label="Nach unten">&#9660;</button></span>'
                  : '<span class="pfeil">›</span>');
  if (nr !== undefined) b.querySelector(".nr").textContent = nr;
  b.querySelector(".oben").textContent = oben;
  b.querySelector(".unten").textContent = unten || "";
  if (sortier){
    const auf = b.querySelector('[data-weg="auf"]');
    const ab  = b.querySelector('[data-weg="ab"]');
    auf.disabled = !sortier.auf;
    ab.disabled  = !sortier.ab;
    auf.addEventListener("click", sortier.beiAuf);
    ab.addEventListener("click", sortier.beiAb);
  } else {
    b.addEventListener("click", beiKlick);
  }
  return b;
}

function uvZeichnen(){
  const ziel = $("uvInhalt");
  ziel.innerHTML = "";

  const ueberschrift = (t) => { const h = document.createElement("h2"); h.textContent = t; ziel.appendChild(h); };

  /* --- Zuleitung --- */
  ueberschrift("Zuleitung");
  if (UV.art === "mobil"){
    const q = UV.quelle && verteilerListe().find(v => v.id === UV.quelle.uvId);
    const qab = q && (q.abgaenge || []).find(a => a.id === UV.quelle.abgangId);
    const nr = qab ? q.abgaenge.indexOf(qab) + 1 : null;
    ziel.appendChild(zeile({
      oben: q ? q.name + " · Abgang " + nr : "Quelle nicht mehr vorhanden",
      unten: qab ? [qab.art, sicherungText(qab.sicherung)].join(" · ") : "",
      beiKlick: () => { if (q) uvOeffnen(q); },
    }));
    platzhalterIn(ziel, "Die Zuleitung ergibt sich aus dem speisenden Abgang und wird dort geändert.");
  } else {
    ziel.appendChild(zeile({
      oben: UV.zuleitung.herkunft || "Herkunft nicht angegeben",
      unten: sicherungText(UV.zuleitung.sicherung),
      beiKlick: zuleitungOeffnen,
    }));
  }

  /* --- Abgänge, nach ihrer Gruppe geordnet --- */
  const frei = UV.abgaenge.filter(a => !a.verbraucher && !a.mobil).length;
  ueberschrift(UV.abgaenge.length
    ? UV.abgaenge.length + " Abgänge, " + frei + " frei"
    : "Abgänge");

  if (UV.abgaenge.length > 1){
    const rk = knopfIn(ziel, sortModus ? "Reihenfolge fertig" : "Reihenfolge ändern",
                       () => { sortModus = !sortModus; uvZeichnen(); },
                       sortModus ? "" : "leer");
    rk.style.marginBottom = "10px";
  }

  /* Eine Abgangszeile behält ihre Nummer aus der Gesamtliste: daran
     hängen Schaltbild und Beschriftung. */
  const abgangZeile = (wohin, a) => {
    const i = UV.abgaenge.indexOf(a);
    wohin.appendChild(zeile({
      nr: i + 1,
      oben: (a.name || a.art) + " — " + verbraucherText(a),
      unten: [a.art, kettenText(a)].filter(Boolean).join(" · "),
      beiKlick: () => abgangOeffnen(a),
      sortier: sortModus ? {
        auf: nachbarInGruppe(i, -1) >= 0,
        ab:  nachbarInGruppe(i, +1) >= 0,
        beiAuf: () => abgangVerschieben(a, -1),
        beiAb:  () => abgangVerschieben(a, +1),
      } : null,
    }));
  };

  const direkt = UV.abgaenge.filter(a => !a.rcd || !UV.rcds.some(r => r.id === a.rcd));
  if (UV.rcds.length) unterschrift(ziel, "Direkt am Verteiler");
  if (!direkt.length && !UV.rcds.length) platzhalterIn(ziel, "Noch keine Abgänge angelegt.");
  direkt.forEach(a => abgangZeile(ziel, a));
  if (!sortModus) zuKnopf(ziel, "Abgänge", () => abgaengeHinzufuegen(null));

  for (const r of UV.rcds){
    const dahinter = UV.abgaenge.filter(a => a.rcd === r.id);
    ziel.appendChild(zeile({
      oben: r.name,
      unten: kettenText(r),
      beiKlick: () => rcdBearbeiten(r),
    }));
    const kasten = gruppenKasten(ziel);
    if (!dahinter.length) platzhalterIn(kasten, "Noch nichts hinter dieser Gruppe.");
    dahinter.forEach(a => abgangZeile(kasten, a));
    if (!sortModus) zuKnopf(kasten, "Abgänge", () => abgaengeHinzufuegen(r.id));
  }

  if (!sortModus){
    knopfIn(ziel, "RCD-Gruppe hinzufügen", rcdHinzufuegen, "leer").style.marginTop = "10px";
    knopfIn(ziel, "Prinzipschaltbild", () => schaltbildZeigen(UV), "leer").style.marginTop = "10px";
  }
}

}

/* --- RCD-Gruppen --- */
async function rcdHinzufuegen(){
  const s = await sicherungWaehlen({ art:"FI", kennlinie:null, strom:40, ma:30 }, "RCD der Gruppe");
  if (!s) return;
  const nummern = UV.rcds.map(r => { const m = /^RCD\s*(\d+)$/i.exec(r.name); return m ? Number(m[1]) : 0; });
  UV.rcds.push({ id: neueKennung("rcd"), name: "RCD " + (Math.max(0, ...nummern) + 1), sicherung: s });
  await merken();
  uvZeichnen();
}

async function rcdBearbeiten(r){
  const dahinter = UV.abgaenge.filter(a => a.rcd === r.id).length;
  const a = await formular({
    titel: r.name,
    text: kettenText(r) + " · " + (dahinter === 1 ? "1 Abgang" : dahinter + " Abgänge"),
    felder: [{ art:"text", name:"name", beschriftung:"Bezeichnung", wert:r.name }],
    knoepfe: [{ text:"Übernehmen", wert:"ok" },
              { text:"RCD ändern", wert:"sicherung", art:"leer" },
              { text:"Vorsicherung ändern", wert:"vorsicherung", art:"leer" },
              { text:"Gruppe löschen", wert:"weg", art:"gefahr" },
              { text:"Abbrechen", wert:null, art:"leer" }],
  });
  if (!a.wahl) return;
  if (a.wahl === "weg"){
    const b = await frage({
      titel: "Gruppe löschen",
      text: dahinter ? "„" + r.name + "“ wird entfernt. " + dahinter +
                       (dahinter === 1 ? " Abgang steht danach ohne RCD." : " Abgänge stehen danach ohne RCD.")
                     : "„" + r.name + "“ wird entfernt.",
      knoepfe: [{ text:"Löschen", wert:true, art:"gefahr" }, { text:"Behalten", wert:false, art:"leer" }],
    });
    if (!b.wahl) return;
    UV.rcds = UV.rcds.filter(x => x.id !== r.id);
    UV.abgaenge.forEach(x => { if (x.rcd === r.id) x.rcd = null; });
  } else {
    if (a.werte.name.trim()) r.name = a.werte.name.trim();
    if (a.wahl === "sicherung"){
      const s = await sicherungWaehlen(r.sicherung, "RCD der Gruppe");
      if (s) r.sicherung = s;
    }
    if (a.wahl === "vorsicherung"){
      const s = await sicherungWaehlen(r.vor || { art:"gG", kennlinie:null, strom:63, ma:null },
                                       "Vorsicherung vor dem RCD");
      if (s) r.vor = hatGeraet(s) ? s : null;
    }
  }
  await merken();
  uvZeichnen();
}

/* --- Abgänge --- */
/* --- Verbraucher am Abgang --- */

function verbraucherText(ab){
  if (ab.mobil){
    const m = verteilerListe().find(v => v.id === ab.mobil);
    return m ? m.name + " (mobiler Verteiler)" : "frei";
  }
  if (!ab.verbraucher) return "frei";
  const b = ab.verbraucher;
  const ort = (b.x === null || b.x === undefined) ? "ohne Ort"
            : b.ortVeraltet ? ((b.standnummer ? b.standnummer + " " : "") + "weggefallen")
            : (b.standort ? (standortName(PLAN, b.standort) || "Standort " + b.standort)
                          : "eigener Ort");
  return (b.name || "Verbraucher") + " · " + ort;
}

async function verbraucherBearbeiten(ab){
  const vorhanden = !!ab.verbraucher;
  const knoepfe = vorhanden
    ? [{ text:"Übernehmen", wert:"ok" },
       { text:"Ort im Plan setzen", wert:"ort", art:"leer" },
       { text:"Verbraucher entfernen", wert:"weg", art:"gefahr" },
       { text:"Abbrechen", wert:null, art:"leer" }]
    : [{ text:"Anschließen und Ort wählen", wert:"ort" },
       { text:"Nur anschließen", wert:"ok", art:"leer" },
       { text:"Abbrechen", wert:null, art:"leer" }];

  const a = await formular({
    titel: vorhanden ? "Verbraucher" : "Verbraucher anschließen",
    text: vorhanden ? undefined : "Jeder Abgang nimmt genau einen Verbraucher auf.",
    felder: [{ art:"text", name:"name", beschriftung:"Bezeichnung",
               wert: vorhanden ? ab.verbraucher.name : "",
               platzhalter:"z. B. Kreissäge, Bauwagen" }],
    knoepfe,
  });
  if (!a.wahl) return false;

  if (a.wahl === "weg"){
    const b = await frage({
      titel:"Verbraucher entfernen",
      text: (ab.verbraucher.name || "Der Verbraucher") + " wird entfernt, der Abgang wird wieder frei.",
      knoepfe:[{ text:"Entfernen", wert:true, art:"gefahr" }, { text:"Behalten", wert:false, art:"leer" }],
    });
    if (!b.wahl) return false;
    ab.verbraucher = null;
    await merken();
    return true;
  }

  if (!ab.verbraucher) ab.verbraucher = { name:"", x:null, y:null, standort:null };
  ab.verbraucher.name = a.werte.name.trim();
  await merken();

  if (a.wahl === "ort"){
    ortWahlStarten(UV.id, ab.id);
    return "gewechselt";
  }
  return true;
}

/* --- Mobiler Verteiler am Abgang --- */

function belegung(ab){
  if (ab.mobil){
    const m = verteilerListe().find(v => v.id === ab.mobil);
    return m ? { art:"mobil", v:m } : null;
  }
  if (ab.verbraucher) return { art:"verbraucher" };
  return null;
}

async function mobilAnschliessen(ab){
  BESTAND = await bestandHolen();
  const frei = BESTAND.filter(t => imEinsatz(t.id) < t.anzahl);
  if (!BESTAND.length){
    return hinweis("Kein Bestand angelegt",
      "Trag zuerst auf dem Startbildschirm unter „Bestand mobiler Verteiler“ ein, " +
      "welche Typen es gibt und wie viele davon.");
  }
  if (!frei.length){
    return hinweis("Nichts mehr verfügbar",
      "Von jedem Typ sind bereits alle vorhandenen Stücke in diesem Plan verplant.");
  }

  const nummern = mobileListe().map(v => { const m = /^MV\s*(\d+)$/i.exec(v.name); return m ? Number(m[1]) : 0; });
  const a = await formular({
    titel: "Mobilen Verteiler anschließen",
    text: "Er wird aus dem Bestand entnommen und an diesen Abgang gehängt.",
    felder: [
      { art:"wahl", name:"typ", beschriftung:"Typ",
        optionen: frei.map(t => ({ wert:t.id,
          text: t.name + " (" + (t.anzahl - imEinsatz(t.id)) + " von " + t.anzahl + " frei)" })) },
      { art:"text", name:"name", beschriftung:"Bezeichnung", wert:"MV " + (Math.max(0, ...nummern) + 1) },
    ],
    knoepfe: [{ text:"Anschließen und Ort wählen", wert:"ort" },
              { text:"Abbrechen", wert:null, art:"leer" }],
  });
  if (!a.wahl) return "abbruch";

  const bestueckung = bestueckungAusTyp(BESTAND.find(t => t.id === a.werte.typ));
  const neu = {
    id: neueKennung("uv"), art:"mobil", typ:a.werte.typ,
    name: a.werte.name.trim() || "MV",
    x: null, y: null,
    quelle: { uvId: UV.id, abgangId: ab.id },
    rcds: bestueckung.rcds,
    abgaenge: bestueckung.abgaenge,
  };
  PLAN.verteiler.push(neu);
  ab.mobil = neu.id;
  await merken();
  ortWahl = { uvId: UV.id, abgangId: ab.id, zweck:"mobil", zielId: neu.id };
  ortWahlOberflaeche();
  return "gewechselt";
}

/* Löscht einen mobilen Verteiler samt allem, was daran hängt. */
function haengtDaran(uvId){
  let verteiler = 0, verbraucher = 0;
  const gehe = (id) => {
    const v = verteilerListe().find(x => x.id === id);
    if (!v) return;
    for (const a of (v.abgaenge || [])){
      if (a.verbraucher) verbraucher++;
      if (a.mobil){ verteiler++; gehe(a.mobil); }
    }
  };
  gehe(uvId);
  return { verteiler, verbraucher };
}
function mobilEntfernen(uvId){
  const weg = new Set();
  const gehe = (id) => {
    weg.add(id);
    const v = verteilerListe().find(x => x.id === id);
    if (!v) return;
    for (const a of (v.abgaenge || [])) if (a.mobil) gehe(a.mobil);
  };
  gehe(uvId);
  for (const v of verteilerListe())
    for (const a of (v.abgaenge || [])) if (a.mobil && weg.has(a.mobil)) a.mobil = null;
  PLAN.verteiler = PLAN.verteiler.filter(v => !weg.has(v.id));
  if (gewaehlt && weg.has(gewaehlt)) gewaehlt = null;
}

const rcdOptionen = () =>
  [{ wert:"", text:"kein RCD" }].concat(UV.rcds.map(r => ({ wert:r.id, text:r.name })));

async function abgaengeHinzufuegen(rcdVorgabe){
  const a = await formular({
    titel: "Abgänge hinzufügen",
    text: "Gleichartige Abgänge lassen sich in einem Zug anlegen.",
    felder: [
      { art:"wahl", name:"art", beschriftung:"Art", optionen: ABGANGSARTEN.map(x => ({ wert:x, text:x })) },
      { art:"zahl", name:"anzahl", beschriftung:"Anzahl", wert:"1" },
      { art:"wahl", name:"rcd", beschriftung:"Hinter RCD",
        wert: rcdVorgabe || "", optionen: rcdOptionen() },
    ],
    knoepfe: [{ text:"Weiter zur Absicherung", wert:true }, { text:"Abbrechen", wert:false, art:"leer" }],
  });
  if (!a.wahl) return;

  const anzahl = Math.max(1, Math.min(99, parseInt(a.werte.anzahl, 10) || 1));
  const s = await sicherungWaehlen(sicherungVorgabe(a.werte.art), "Absicherung der Abgänge");
  if (!s) return;

  for (let i=0;i<anzahl;i++){
    UV.abgaenge.push({
      id: neueKennung("ab"), art: a.werte.art, name: "",
      sicherung: JSON.parse(JSON.stringify(s)),
      rcd: a.werte.rcd || null,
    });
  }
  await merken();
  uvZeichnen();
}

/* Eigener Bildschirm statt einer Karte mit sechs Knöpfen. Jede Zeile
   führt in ein Fenster mit genau einem Feld; gespeichert wird sofort,
   der Zurück-Pfeil genügt. */

let ABG = null;

function abgangOeffnen(ab){
  ABG = ab;
  abgangSchirmZeichnen();
  schirmZeigen("schirmAbgang");
}

$("abZurueck").addEventListener("click", () => {
  ABG = null;
  schirmZeigen("schirmUV");
  uvZeichnen();
});

const abgangNr = (ab) => UV.abgaenge.indexOf(ab) + 1;

async function abgangGeaendert(){
  await merken();
  abgangSchirmZeichnen();
}

function abgangSchirmZeichnen(){
  const ziel = $("abInhalt");
  const ab = ABG;
  if (!ab) return;
  ziel.innerHTML = "";
  $("abTitel").textContent = "Abgang " + abgangNr(ab);

  /* --- Abgang --- */
  const h1 = document.createElement("h2"); h1.textContent = "Abgang"; ziel.appendChild(h1);
  ziel.appendChild(zeile({
    oben: ab.name || "ohne Bezeichnung",
    unten: "Bezeichnung",
    beiKlick: async () => {
      const a = await formular({
        titel: "Bezeichnung",
        text: "Frei lassen, dann steht im Plan die Art des Abgangs.",
        felder: [{ art:"text", name:"name", beschriftung:"Bezeichnung", wert:ab.name,
                   platzhalter:"z. B. Podest" }],
        knoepfe: [{ text:"Übernehmen", wert:true }, { text:"Abbrechen", wert:false, art:"leer" }],
      });
      if (!a.wahl) return;
      ab.name = a.werte.name.trim();
      await abgangGeaendert();
    },
  }));
  ziel.appendChild(zeile({
    oben: ab.art,
    unten: "Art",
    beiKlick: async () => {
      const a = await formular({
        titel: "Art des Abgangs",
        felder: [{ art:"wahl", name:"art", beschriftung:"Art", wert:ab.art,
                   optionen: ABGANGSARTEN.map(x => ({ wert:x, text:x })) }],
        knoepfe: [{ text:"Übernehmen", wert:true }, { text:"Abbrechen", wert:false, art:"leer" }],
      });
      if (!a.wahl) return;
      ab.art = a.werte.art;
      await abgangGeaendert();
    },
  }));
  if (UV.rcds.length){
    const r = UV.rcds.find(x => x.id === ab.rcd);
    ziel.appendChild(zeile({
      oben: r ? r.name : "kein RCD",
      unten: "Hinter RCD",
      beiKlick: async () => {
        const a = await formular({
          titel: "Hinter RCD",
          felder: [{ art:"wahl", name:"rcd", beschriftung:"Gruppe", wert:ab.rcd || "",
                     optionen: rcdOptionen() }],
          knoepfe: [{ text:"Übernehmen", wert:true }, { text:"Abbrechen", wert:false, art:"leer" }],
        });
        if (!a.wahl) return;
        ab.rcd = a.werte.rcd || null;
        await abgangGeaendert();
      },
    }));
  }

  /* --- Absicherung, in der Reihenfolge des Schaltbilds --- */
  const h2 = document.createElement("h2"); h2.textContent = "Absicherung"; ziel.appendChild(h2);
  ziel.appendChild(zeile({
    oben: hatGeraet(ab.vor) ? sicherungText(ab.vor) : "kein vorgeschaltetes Gerät",
    unten: "Vorgeschaltet",
    beiKlick: async () => {
      const s = await sicherungWaehlen(ab.vor || { art:"FI", kennlinie:null, strom:40, ma:30 },
                                       "Vorgeschaltet vor Abgang " + abgangNr(ab));
      if (!s) return;
      ab.vor = hatGeraet(s) ? s : null;
      await abgangGeaendert();
    },
  }));
  ziel.appendChild(zeile({
    oben: sicherungText(ab.sicherung),
    unten: "Schutzorgan des Abgangs",
    beiKlick: async () => {
      const s = await sicherungWaehlen(ab.sicherung, "Absicherung des Abgangs");
      if (!s) return;
      ab.sicherung = s;
      await abgangGeaendert();
    },
  }));

  /* --- Was daran hängt --- */
  const h3 = document.createElement("h2"); h3.textContent = "Angeschlossen"; ziel.appendChild(h3);
  if (ab.mobil){
    const m = verteilerListe().find(v => v.id === ab.mobil);
    ziel.appendChild(zeile({
      oben: m ? m.name : "Verteiler nicht mehr vorhanden",
      unten: "Mobiler Verteiler · öffnen",
      beiKlick: async () => {
        await merken();
        if (m){ ABG = null; uvOeffnen(m); }
      },
    }));
    knopfIn(ziel, "Mobilen Verteiler abhängen", async () => {
      if (await mobilAbhaengen(ab)) await abgangGeaendert();
    }, "gefahr");
  } else if (ab.verbraucher){
    const v = ab.verbraucher;
    ziel.appendChild(zeile({
      oben: v.name || "ohne Bezeichnung",
      unten: "Verbraucher",
      beiKlick: async () => {
        const a = await formular({
          titel: "Verbraucher",
          felder: [{ art:"text", name:"name", beschriftung:"Bezeichnung", wert:v.name,
                     platzhalter:"z. B. Kreissäge, Bauwagen" }],
          knoepfe: [{ text:"Übernehmen", wert:true }, { text:"Abbrechen", wert:false, art:"leer" }],
        });
        if (!a.wahl) return;
        v.name = a.werte.name.trim();
        await abgangGeaendert();
      },
    }));
    ziel.appendChild(zeile({
      oben: v.standnummer ? "Standort " + v.standnummer
                          : (v.x !== null && v.x !== undefined ? "frei im Plan gesetzt" : "kein Ort gesetzt"),
      unten: v.ortVeraltet ? "Ort · der Standort hat sich geändert" : "Ort im Plan",
      beiKlick: async () => { await merken(); ABG = null; ortWahlStarten(UV.id, ab.id); },
    }));
    knopfIn(ziel, "Verbraucher entfernen", async () => {
      const b = await frage({
        titel: "Verbraucher entfernen",
        text: (v.name || "Der Verbraucher") + " wird entfernt, der Abgang wird wieder frei.",
        knoepfe: [{ text:"Entfernen", wert:true, art:"gefahr" },
                  { text:"Behalten", wert:false, art:"leer" }],
      });
      if (!b.wahl) return;
      ab.verbraucher = null;
      await abgangGeaendert();
    }, "gefahr");
  } else {
    platzhalterIn(ziel, "Der Abgang ist frei.");
    knopfIn(ziel, "Verbraucher anschließen", async () => {
      await merken();
      const erg = await verbraucherBearbeiten(ab);
      if (erg === "gewechselt") ABG = null;
      else await abgangGeaendert();
    }, "leer");
    knopfIn(ziel, "Mobilen Verteiler anschließen", async () => {
      await merken();
      const erg = await mobilAnschliessen(ab);
      if (erg !== "gewechselt") await abgangGeaendert();
    }, "leer");
  }

  knopfIn(ziel, "Abgang löschen", async () => {
    const nr = abgangNr(ab);
    const b = await frage({
      titel: "Abgang löschen",
      text: ab.mobil
        ? "Abgang " + nr + " wird entfernt. Der daran hängende mobile Verteiler wird abgehängt."
        : ab.verbraucher
          ? "Abgang " + nr + " wird entfernt, samt dem angeschlossenen Verbraucher."
          : "Abgang " + nr + " wird entfernt.",
      knoepfe: [{ text:"Löschen", wert:true, art:"gefahr" }, { text:"Behalten", wert:false, art:"leer" }],
    });
    if (!b.wahl) return;
    if (ab.mobil) mobilEntfernen(ab.mobil);
    UV.abgaenge = UV.abgaenge.filter(x => x.id !== ab.id);
    await merken();
    ABG = null;
    schirmZeigen("schirmUV");
    uvZeichnen();
  }, "gefahr").style.marginTop = "18px";
}

/* Rückgabe: true, wenn wirklich abgehängt wurde */
async function mobilAbhaengen(ab){
  const zahlen = haengtDaran(ab.mobil);
  const m = verteilerListe().find(v => v.id === ab.mobil);
  const anhang = [];
  if (zahlen.verteiler) anhang.push(zahlen.verteiler + (zahlen.verteiler === 1 ? " weiterer mobiler Verteiler" : " weitere mobile Verteiler"));
  if (zahlen.verbraucher) anhang.push(zahlen.verbraucher + " Verbraucher");
  const b = await frage({
    titel: "Mobilen Verteiler abhängen",
    text: (m ? "„" + m.name + "“" : "Der Verteiler") + " wird aus dem Plan entfernt und geht zurück in den Bestand." +
          (anhang.length ? " Mit entfernt " +
            (anhang.length > 1 || zahlen.verteiler > 1 || zahlen.verbraucher > 1 ? "werden" : "wird") +
            ": " + anhang.join(" und ") + "." : ""),
    knoepfe: [{ text:"Abhängen", wert:true, art:"gefahr" }, { text:"Behalten", wert:false, art:"leer" }],
  });
  if (!b.wahl) return false;
  mobilEntfernen(ab.mobil);
  ab.mobil = null;
  return true;
}

/* Ausstattung eines Typs: der Anschluss, mit dem er gespeist wird, und
   die Abgänge, die er mitbringt. Steht das am Typ, legt die App die
   Abgänge beim Anschließen im Plan gleich mit an. */
function ausstattungText(t){
  if (!t.anschluss) return null;
  const stueck = (t.gruppen || []).reduce((n, g) => n + g.anzahl, 0) + (t.durchgeschleift ? 1 : 0);
  const rcds = (t.rcds || []).length;
  return "Anschluss " + t.anschluss + " · " +
         (stueck === 1 ? "1 Abgang" : stueck + " Abgänge") +
         (rcds ? " · " + (rcds === 1 ? "1 RCD-Gruppe" : rcds + " RCD-Gruppen") : "");
}
const anschlussOptionen = () =>
  [{ wert:"", text:"ohne Angabe" }].concat(ABGANGSARTEN.map(x => ({ wert:x, text:x })));

async function typHinzufuegen(){

  };

/* Liste der Abgänge eines Typs. Jede Gruppe ist ein Knopf. */
const typRcdName = (t, id) => {
  const r = (t.rcds || []).find(x => x.id === id);
  return r ? r.name : null;
};
const typRcdOptionen = (t) =>
  [{ wert:"", text:"kein RCD" }].concat((t.rcds || []).map(r => ({ wert:r.id, text:r.name })));

/* Eine RCD-Gruppe am Typ. Sie kann wie im Plan ein vorgeschaltetes
   Gerät führen, also die gemeinsame Vorsicherung vor dem FI. */
async function typRcd(t, r){
  if (!r){
    const s = await sicherungWaehlen({ art:"FI", kennlinie:null, strom:40, ma:30 }, "RCD der Gruppe");
    if (!s) return;
    const nummern = t.rcds.map(x => { const m = /^RCD\s*(\d+)$/i.exec(x.name); return m ? Number(m[1]) : 0; });
    t.rcds.push({ id: neueKennung("rcd"), name: "RCD " + (Math.max(0, ...nummern) + 1),
                  sicherung: s, vor: null });
    return;
  }
  const dahinter = t.gruppen.filter(g => g.rcd === r.id);
  const stueck = dahinter.reduce((n, g) => n + g.anzahl, 0);
  const a = await formular({
    titel: r.name,
    text: kettenText(r) + " · " + (stueck === 1 ? "1 Abgang" : stueck + " Abgänge") + " dahinter",
    felder: [{ art:"text", name:"name", beschriftung:"Bezeichnung", wert:r.name }],
    knoepfe: [{ text:"Übernehmen", wert:"ok" },
              { text:"RCD ändern", wert:"sicherung", art:"leer" },
              { text:"Vorsicherung ändern", wert:"vor", art:"leer" },
              { text:"Gruppe entfernen", wert:"weg", art:"gefahr" },
              { text:"Abbrechen", wert:null, art:"leer" }],
  });
  if (!a.wahl) return;
  if (a.wahl === "weg"){
    for (const g of dahinter) g.rcd = null;
    t.rcds = t.rcds.filter(x => x !== r);
    return;
  }
  if (a.werte.name.trim()) r.name = a.werte.name.trim();
  if (a.wahl === "sicherung"){
    const s = await sicherungWaehlen(r.sicherung, "RCD der Gruppe");
    if (s) r.sicherung = s;
  }
  if (a.wahl === "vor"){
    const s = await sicherungWaehlen(r.vor || { art:"gG", kennlinie:null, strom:63, ma:null },
                                     "Vorsicherung vor dem RCD");
    if (s) r.vor = hatGeraet(s) ? s : null;
  }
}

/* Eine Gruppe gleichartiger Abgänge am Typ */
async function typGruppe(t, g, rcdVorgabe){
  const erlaubt = bisGroesse(t.anschluss);
  const a = await formular({
    titel: g ? "Abgänge ändern" : "Abgänge hinzufügen",
    text: g ? sicherungText(g.sicherung) : undefined,
    felder: [
      { art:"wahl", name:"art", beschriftung:"Art",
        wert: g ? g.art : erlaubt[erlaubt.length - 1],
        optionen: erlaubt.map(x => ({ wert:x, text:x })) },
      { art:"zahl", name:"anzahl", beschriftung:"Anzahl", wert: g ? String(g.anzahl) : "1" },
      { art:"wahl", name:"rcd", beschriftung:"Hinter RCD",
        wert: (g ? g.rcd : rcdVorgabe) || "", optionen: typRcdOptionen(t) },
    ],
    knoepfe: [{ text: g ? "Übernehmen" : "Weiter zur Absicherung", wert:"ok" }]
      .concat(g ? [{ text:"Absicherung ändern", wert:"sicherung", art:"leer" },
                   { text:"Abgänge löschen", wert:"weg", art:"gefahr" }] : [])
      .concat([{ text:"Abbrechen", wert:null, art:"leer" }]),
  });
  if (!a.wahl) return;
  if (a.wahl === "weg"){ t.gruppen = t.gruppen.filter(x => x !== g); return; }

  const art = a.werte.art;
  const anzahl = Math.max(1, Math.min(99, parseInt(a.werte.anzahl, 10) || 1));
  if (!g){
    const s = await sicherungWaehlen(sicherungVorgabe(art), "Absicherung der Abgänge");
    if (!s) return;
    t.gruppen.push({ art, anzahl, sicherung: s, rcd: a.werte.rcd || null });
    return;
  }
  g.art = art; g.anzahl = anzahl; g.rcd = a.werte.rcd || null;
  if (a.wahl === "sicherung"){
    const s = await sicherungWaehlen(g.sicherung, "Absicherung der Abgänge");
    if (s) g.sicherung = s;
  }
}

/* Aus der Ausstattung eines Typs die RCD-Gruppen und Abgänge eines neuen
   Verteilers. Jedes Stück bekommt eigene Kennungen, die Zuordnung der
   Abgänge zu ihrer Gruppe wird dabei umgeschrieben. */
function bestueckungAusTyp(t){
  const rcds = [], abgaenge = [], neueId = {};
  if (!t) return { rcds, abgaenge };

  for (const r of (t.rcds || [])){
    const id = neueKennung("rcd");
    neueId[r.id] = id;
    rcds.push({ id, name: r.name,
                sicherung: JSON.parse(JSON.stringify(r.sicherung)),
                vor: r.vor ? JSON.parse(JSON.stringify(r.vor)) : null });
  }
  if (t.durchgeschleift && t.anschluss === "CEE 63A")
    abgaenge.push({ id: neueKennung("ab"), art:"CEE 63A", name:"durchgeschleift",
                    sicherung:{ art:"ohne", kennlinie:null, strom:null, ma:null }, rcd:null });
  for (const g of (t.gruppen || []))
    for (let i = 0; i < g.anzahl; i++)
      abgaenge.push({ id: neueKennung("ab"), art:g.art, name:"",
                      sicherung: JSON.parse(JSON.stringify(g.sicherung)),
                      rcd: (g.rcd && neueId[g.rcd]) || null });
  return { rcds, abgaenge };
}

/* Der Bildschirm für die Ausstattung steht in Abschnitt 7a. */
async function typBearbeiten(t){
  const benutzt = PLAN ? imEinsatz(t.id) : 0;
  const a = await formular({
    titel: t.name,
    text: PLAN && benutzt ? benutzt + (benutzt === 1 ? " Stück ist" : " Stück sind") + " in diesem Plan verplant." : undefined,
    felder: [
      { art:"text", name:"name", beschriftung:"Bezeichnung", wert:t.name },
      { art:"zahl", name:"anzahl", beschriftung:"Vorhandene Stückzahl", wert:String(t.anzahl) },
      { art:"wahl", name:"anschluss", beschriftung:"Anschluss", wert: t.anschluss || "",
        optionen: anschlussOptionen() },
    ],
    knoepfe: [{ text:"Übernehmen", wert:"ok" },
              { text:"Ausstattung", wert:"abgaenge", art:"leer" },
              { text:"Typ löschen", wert:"weg", art:"gefahr" },
              { text:"Abbrechen", wert:null, art:"leer" }],
  });
  if (!a.wahl) return;
  if (a.wahl === "weg"){
    if (benutzt){
      return hinweis("Typ wird noch genutzt",
        "In diesem Plan " + (benutzt === 1 ? "steht ein Verteiler" : "stehen " + benutzt + " Verteiler") +
        " dieses Typs. Entferne sie zuerst aus dem Plan.");
    }
    const b = await frage({
      titel:"Typ löschen", text:"„" + t.name + "“ wird aus dem Bestand entfernt.",
      knoepfe:[{ text:"Löschen", wert:true, art:"gefahr" }, { text:"Behalten", wert:false, art:"leer" }],
    });
    if (!b.wahl) return;
    BESTAND = BESTAND.filter(x => x.id !== t.id);
  } else {
    if (a.werte.name.trim()) t.name = a.werte.name.trim();
    const neu = Math.max(0, Math.min(999, parseInt(a.werte.anzahl, 10) || 0));
    if (neu < benutzt){
      return hinweis("Stückzahl zu klein",
        "Im Plan " + (benutzt === 1 ? "steht bereits ein Verteiler" : "stehen bereits " + benutzt + " Verteiler") +
        " dieses Typs. Die Stückzahl kann nicht darunter liegen.");
    }
    t.anzahl = neu;

    /* Wird der Anschluss kleiner, passen größere Abgänge nicht mehr. */
    const anschluss = a.werte.anschluss || null;
    if (anschluss !== t.anschluss){
      const zuGross = (t.gruppen || []).filter(g => STECKERGROESSE[g.art] > (STECKERGROESSE[anschluss] || 99));
      const durchWeg = t.durchgeschleift && anschluss !== "CEE 63A";
      if (zuGross.length || durchWeg){
        const b = await frage({
          titel: "Abgänge passen nicht mehr",
          text: "Mit dem Anschluss " + (anschluss || "ohne Angabe") + " " +
                (zuGross.length
                  ? "entfallen " + zuGross.map(g => g.anzahl + " × " + g.art).join(", ")
                  : "entfällt der durchgeschleifte Abgang") +
                (zuGross.length && durchWeg ? " und der durchgeschleifte Abgang" : "") + ".",
          knoepfe: [{ text:"Anschluss ändern", wert:true, art:"gefahr" },
                    { text:"Abbrechen", wert:false, art:"leer" }],
        });
        if (!b.wahl) return;
        t.gruppen = (t.gruppen || []).filter(g => STECKERGROESSE[g.art] <= (STECKERGROESSE[anschluss] || 99));
        if (durchWeg) t.durchgeschleift = false;
      }
      t.anschluss = anschluss;
    }
    if (a.wahl === "abgaenge"){
      await bestandSpeichern(BESTAND);
      return typOeffnen(t);
    }
  }
  await bestandSpeichern(BESTAND);
  bestandZeichnen();
}

/* ---- Bausteine für gegliederte Listen ---- */

/* Kleine Zwischenüberschrift innerhalb eines Abschnitts */
function unterschrift(ziel, text){

/* Eingerückter Kasten mit Linie links – das Gegenstück zur
   Untersammelschiene im Schaltbild */
function gruppenKasten(ziel){

}

/* Leiser Knopf zum Anlegen, gehört immer zu dem Abschnitt darüber */
function zuKnopf(ziel, text, beiKlick){

/* Zeile mit Kästchen zum Ankreuzen */
function hakenZeile(ziel, { text, unten, an, beiKlick }){
  const b = document.createElement("button");
  b.className = "hakenzeile" + (an ? " an" : "");
  b.innerHTML = '<span class="haken">&#10003;</span>' +
                '<span class="haupt"><span class="oben"></span><span class="unten"></span></span>';

const knopfIn = (ziel, t, beiKlick, art) => {
  const b = document.createElement("button");
  b.className = "knopf" + (art ? " " + art : "");
  b.textContent = t;
  b.addEventListener("click", beiKlick);
  ziel.appendChild(b);
  return b;
};
const platzhalterIn = (ziel, text) => {
  const p = document.createElement("div");
  p.className = "platzhalter";
  p.textContent = text;
  ziel.appendChild(p);
};

/* ---- Ausstattung eines Bestandstyps ---- */

let TYP = null;
let typSort = false;

/* Verschoben wird nur innerhalb der eigenen Gruppe, wie im Verteiler.
   Die Reihenfolge bestimmt später, in welcher Folge die Abgänge im
   Plan angelegt werden. */
function typNachbar(i, richtung){
  const liste = TYP.gruppen, g = liste[i].rcd || null;
  for (let k = i + richtung; k >= 0 && k < liste.length; k += richtung)
    if ((liste[k].rcd || null) === g) return k;
  return -1;
}
async function typVerschieben(g, richtung){
  const liste = TYP.gruppen;
  const i = liste.indexOf(g);
  if (i < 0) return;
  const k = typNachbar(i, richtung);
  if (k < 0) return;
  liste[i] = liste[k]; liste[k] = g;
  await bestandSpeichern(BESTAND);
  typZeichnen();
}

function typOeffnen(t){
  TYP = t;
  typSort = false;
  if (!TYP.gruppen) TYP.gruppen = [];
  if (!TYP.rcds) TYP.rcds = [];
  $("typTitel").textContent = t.name;
  typZeichnen();
  schirmZeigen("schirmTyp");
}

$("typZurueck").addEventListener("click", async () => {
  await bestandSpeichern(BESTAND);
  TYP = null;
  bestandZeichnen();
  schirmZeigen("schirmBestand");
});

/* Eine Abgangsgruppe als Zeile */
function gruppenZeile(ziel, g){
  const i = TYP.gruppen.indexOf(g);
  ziel.appendChild(zeile({
    nr: g.anzahl,
    oben: g.art,
    unten: sicherungText(g.sicherung),
    beiKlick: async () => { await typGruppe(TYP, g); await bestandSpeichern(BESTAND); typZeichnen(); },
    sortier: typSort ? {
      auf: typNachbar(i, -1) >= 0,
      ab:  typNachbar(i, +1) >= 0,
      beiAuf: () => typVerschieben(g, -1),
      beiAb:  () => typVerschieben(g, +1),
    } : null,
  }));
}

function typZeichnen(){
  const ziel = $("typInhalt");
  ziel.innerHTML = "";
  const t = TYP;

  const stueck = t.gruppen.reduce((n, g) => n + g.anzahl, 0) + (t.durchgeschleift ? 1 : 0);
  platzhalterIn(ziel, [t.anschluss || "Anschluss offen",
                       stueck === 1 ? "1 Abgang" : stueck + " Abgänge",
                       t.rcds.length ? (t.rcds.length === 1 ? "1 RCD-Gruppe" : t.rcds.length + " RCD-Gruppen") : null]
                      .filter(Boolean).join(" · "));

  /* --- Anschluss --- */
  const h1 = document.createElement("h2"); h1.textContent = "Anschluss"; ziel.appendChild(h1);
  ziel.appendChild(zeile({
    oben: t.anschluss || "noch nicht festgelegt",
    unten: "Größere Abgänge als der Anschluss stehen nicht zur Wahl",
    beiKlick: typAnschlussAendern,
  }));
  if (t.anschluss === "CEE 63A")
    hakenZeile(ziel, {
      text: "Durchgeschleifter Abgang",
      unten: "CEE 63 A ohne Absicherung, direkt am Anschluss",
      an: !!t.durchgeschleift,
      beiKlick: async () => {
        t.durchgeschleift = !t.durchgeschleift;
        await bestandSpeichern(BESTAND);
        typZeichnen();
      },
    });

  /* --- Abgänge --- */
  const h2 = document.createElement("h2"); h2.textContent = "Abgänge"; ziel.appendChild(h2);
  if (!t.anschluss){
    platzhalterIn(ziel, "Leg zuerst den Anschluss fest.");
    return;
  }

  if (t.gruppen.length > 1){
    const rk = knopfIn(ziel, typSort ? "Reihenfolge fertig" : "Reihenfolge ändern",
                       () => { typSort = !typSort; typZeichnen(); },
                       typSort ? "" : "leer");
    rk.style.marginBottom = "10px";
  }

  const direkt = t.gruppen.filter(g => !g.rcd);
  if (t.rcds.length) unterschrift(ziel, "Direkt am Anschluss");
  if (!direkt.length && !t.rcds.length) platzhalterIn(ziel, "Noch keine Abgänge angelegt.");
  direkt.forEach(g => gruppenZeile(ziel, g));
  if (!typSort) zuKnopf(ziel, "Abgänge", () => typGruppeNeu(null));

  for (const r of t.rcds){
    const dahinter = t.gruppen.filter(g => g.rcd === r.id);
    ziel.appendChild(zeile({
      oben: r.name,
      unten: kettenText(r),
      beiKlick: async () => { await typRcd(t, r); await bestandSpeichern(BESTAND); typZeichnen(); },
    }));
    const kasten = gruppenKasten(ziel);
    if (!dahinter.length) platzhalterIn(kasten, "Noch nichts hinter dieser Gruppe.");
    dahinter.forEach(g => gruppenZeile(kasten, g));
    if (!typSort) zuKnopf(kasten, "Abgänge", () => typGruppeNeu(r.id));
  }

  if (typSort) return;
  knopfIn(ziel, "RCD-Gruppe hinzufügen", async () => {
    await typRcd(TYP, null);
    await bestandSpeichern(BESTAND);
    typZeichnen();
  }, "leer").style.marginTop = "10px";
}

async function typGruppeNeu(rcdId){
  await typGruppe(TYP, null, rcdId);
  await bestandSpeichern(BESTAND);
  typZeichnen();
}

async function typAnschlussAendern(){
  const t = TYP;
  const a = await formular({
    titel: "Anschluss",
    text: "Womit wird der Verteiler gespeist? Danach richtet sich, welche Abgänge möglich sind.",
    felder: [{ art:"wahl", name:"anschluss", beschriftung:"Anschluss",
               wert: t.anschluss || "", optionen: anschlussOptionen() }],
    knoepfe: [{ text:"Übernehmen", wert:true }, { text:"Abbrechen", wert:false, art:"leer" }],
  });
  if (!a.wahl) return;
  const neu = a.werte.anschluss || null;
  if (neu === t.anschluss) return;
  const zuGross = t.gruppen.filter(g => STECKERGROESSE[g.art] > (STECKERGROESSE[neu] || 99));
  const durchWeg = t.durchgeschleift && neu !== "CEE 63A";
  if (zuGross.length || durchWeg){
    const b = await frage({
      titel: "Abgänge passen nicht mehr",
      text: "Mit dem Anschluss " + (neu || "ohne Angabe") + " " +
            (zuGross.length ? "entfallen " + zuGross.map(g => g.anzahl + " × " + g.art).join(", ")
                            : "entfällt der durchgeschleifte Abgang") +
            (zuGross.length && durchWeg ? " und der durchgeschleifte Abgang" : "") + ".",
      knoepfe: [{ text:"Anschluss ändern", wert:true, art:"gefahr" },
                { text:"Abbrechen", wert:false, art:"leer" }],
    });
    if (!b.wahl) return;
    t.gruppen = t.gruppen.filter(g => STECKERGROESSE[g.art] <= (STECKERGROESSE[neu] || 99));
    if (durchWeg) t.durchgeschleift = false;
  }
  t.anschluss = neu;
  await bestandSpeichern(BESTAND);
  typZeichnen();
}

/* ================================================================== */
/* 8 · Planwechsel                                                     */
/* ================================================================== */

const ABGLEICH_TOLERANZ = 1.0;   // Zeichnungseinheiten

/* Ordnet die Standorte zweier Fassungen einander zu. Verglichen wird die
   absolute Lage, weil der Bezugspunkt eines Plans aus seinem eigenen
   Inhalt entsteht und zwischen zwei Fassungen wandern kann. */
function standorteAbgleichen(alt, neu){
  const abs = (p) => p.standorte.map(s => ({
    nr:s.nr, farbe:s.farbe, r:s.r, ax:s.x + p.nullpunkt.x, ay:s.y + p.nullpunkt.y, roh:s }));
  const a = abs(alt), n = abs(neu);
  const vergeben = new Set();
  const paare = new Map();       // alte Nummer -> neuer Standort
  let farbwechsel = 0;

  for (const s of a){
    let beste = null, nah = ABGLEICH_TOLERANZ;
    for (const t of n){
      if (vergeben.has(t.nr)) continue;
      const d = Math.hypot(t.ax-s.ax, t.ay-s.ay);
      if (d < nah){ nah = d; beste = t; }
    }
    if (beste){
      vergeben.add(beste.nr);
      paare.set(s.nr, beste);
      if (beste.farbe !== s.farbe) farbwechsel++;
    }
  }
  return {
    paare, farbwechsel,
    weggefallen: a.filter(s => !paare.has(s.nr)),
    hinzugekommen: n.filter(t => !vergeben.has(t.nr)),
    unveraendert: paare.size,
  };
}

/* Übernimmt die Eintragungen der alten Fassung in die neue. */
function eintragungenUebernehmen(alt, neu, abgleich){
  neu.id = alt.id;
  neu.name = alt.name;
  neu.angelegt = alt.angelegt;
  neu.aktualisiert = Date.now();
  neu.farbenAus = alt.farbenAus || [];
  neu.verteiler = alt.verteiler || [];

  let umgesetzt = 0, verloren = 0;
  for (const v of neu.verteiler){
    for (const ab of (v.abgaenge || [])){
      const b = ab.verbraucher;
      if (!b || b.standort === null || b.standort === undefined) continue;
      const treffer = abgleich.paare.get(b.standort);
      if (treffer){
        b.standort = treffer.nr;
        b.standnummer = standortBezeichnung(treffer.roh);
        b.x = treffer.ax;          // leichte Verschiebungen mitziehen
        b.y = treffer.ay;
        b.ortVeraltet = false;
        umgesetzt++;
      } else {
        b.standort = null;
        b.ortVeraltet = true;      // Lage bleibt, sie bildet die Wirklichkeit ab
        verloren++;
      }
    }
  }
  return { umgesetzt, verloren };
}

async function planAktualisieren(alt){
  const datei = await dateiWaehlen();
  if (!datei) return;
  let neu;
  try{
    neu = await dateiEinlesen(datei);
  }catch(e){
    arbeitAus();
    return hinweis("Das hat nicht geklappt", (e && e.message) ? e.message : String(e));
  }
  arbeitAus();

  const abgleich = standorteAbgleichen(alt, neu);
  const eintraege = alt.verteiler ? alt.verteiler.length : 0;
  const betroffen = (alt.verteiler || []).reduce((n,v) =>
    n + (v.abgaenge || []).filter(a => a.verbraucher && a.verbraucher.standort).length, 0);

  const a = await frage({
    titel: "Plan ersetzen?",
    text: [
      "Standorte: " + abgleich.unveraendert + " unverändert, " +
        abgleich.hinzugekommen.length + " neu, " + abgleich.weggefallen.length + " weggefallen",
      abgleich.farbwechsel ? abgleich.farbwechsel + " davon mit geänderter Farbe" : "",
      "",
      "Deine Eintragungen bleiben: " + eintraege +
        (eintraege === 1 ? " Verteiler" : " Verteiler") + ", " + betroffen +
        (betroffen === 1 ? " verorteter Verbraucher" : " verortete Verbraucher"),
      abgleich.weggefallen.length
        ? "Verbraucher an weggefallenen Standorten behalten ihre Lage und werden gekennzeichnet."
        : "",
    ].filter(x => x !== "").join("\n"),
    knoepfe: [{ text:"Plan ersetzen", wert:true },
              { text:"Abbrechen", wert:false, art:"leer" }],
  });
  if (!a.wahl) return;

  const bilanz = eintragungenUebernehmen(alt, neu, abgleich);
  await planSpeichern(neu);
  if (PLAN && PLAN.id === neu.id) await planOeffnen(neu.id);
  else await listeZeichnen();

  await hinweis("Plan ersetzt",
    [ bilanz.umgesetzt + (bilanz.umgesetzt === 1 ? " Verbraucher wurde" : " Verbraucher wurden") +
        " auf den neuen Standort gezogen.",
      bilanz.verloren
        ? bilanz.verloren + (bilanz.verloren === 1 ? " Verbraucher steht" : " Verbraucher stehen") +
          " an einer Stelle, an der im neuen Plan kein Standort mehr ist. " +
          "Sie sind im Plan gestrichelt gezeichnet und in der Abgangsliste gekennzeichnet."
        : "",
      neu.uebergangen ? neu.uebergangen + " Teile lagen weit außerhalb und wurden übergangen." : "",
    ].filter(Boolean).join("\n\n"));
}

/* ================================================================== */
/* 9 · Standnummern                                                    */
/* ================================================================== */

const NUMMER_MUSTER = /^([A-Za-zÄÖÜäöü])[\s.-]?(\d{2})$/;
let REICHWEITE = 20;   // Zeichnungseinheiten; darüber hinaus wird nichts zugeordnet.
                       // Über die Angaben einstellbar, gilt für alle Pläne.

function alsStandnummer(text){
  const m = NUMMER_MUSTER.exec(String(text || "").trim());
  return m ? (m[1].toUpperCase() + m[2]) : null;
}

/* Der gespeicherte Punkt ist die linke Grundlinie. Für den Abstand
   zählt die Mitte der Beschriftung, sonst zieht es lange Texte schief. */
function textMitte(t){
  const breite = 0.55 * t.h * String(t.s).length;
  const dx = breite/2, dy = t.h * 0.35;
  const c = Math.cos(t.dreh || 0), s = Math.sin(t.dreh || 0);
  return { x: t.x + dx*c - dy*s, y: t.y + dx*s + dy*c };
}

/* Ordnet jedem Kreis die nächste freie Standnummer zu: alle Paare nach
   Abstand, kürzestes zuerst, beide Beteiligten danach vergeben. */
function standnummernZuordnen(plan){
  const kreise = plan.standorte || [];
  const nummern = [];
  for (const t of (plan.texte || [])){
    const n = alsStandnummer(t.s);
    if (n) nummern.push(Object.assign({ nummer:n }, textMitte(t)));
  }
  for (const k of kreise) k.nummer = null;

  const paare = [];
  for (let i=0;i<kreise.length;i++){
    for (let j=0;j<nummern.length;j++){
      const d = Math.hypot(kreise[i].x - nummern[j].x, kreise[i].y - nummern[j].y);
      if (d <= REICHWEITE) paare.push({ i, j, d });
    }
  }
  paare.sort((a,b) => a.d - b.d);

  const kreisVergeben = new Set(), nummerVergeben = new Set();
  let zugeordnet = 0, groesster = 0;
  for (const p of paare){
    if (kreisVergeben.has(p.i) || nummerVergeben.has(p.j)) continue;
    kreise[p.i].nummer = nummern[p.j].nummer;
    kreisVergeben.add(p.i); nummerVergeben.add(p.j);
    zugeordnet++;
    if (p.d > groesster) groesster = p.d;
  }

  /* Wer keine eigene bekommen hat, wird über die nächste Nummer
     überhaupt beschrieben – "Nahe E04" ist brauchbarer als "Standort 18".
     Dafür gilt keine Reichweite, es ist nur ein Anhaltspunkt. */
  let mitBezug = 0;
  for (const k of kreise){
    k.naheNummer = null;
    if (k.nummer) continue;
    let beste = null, nah = Infinity;
    for (const n of nummern){
      const d = Math.hypot(k.x - n.x, k.y - n.y);
      if (d < nah){ nah = d; beste = n; }
    }
    if (beste){ k.naheNummer = beste.nummer; mitBezug++; }
  }

  // doppelt vergebene Nummern kennzeichnen, falls der Plan sie doppelt führt
  const zaehler = new Map();
  for (const k of kreise) if (k.nummer) zaehler.set(k.nummer, (zaehler.get(k.nummer)||0) + 1);

  return {
    gefunden: nummern.length,
    zugeordnet,
    ohne: kreise.length - zugeordnet,
    mitBezug,
    ungenutzt: nummern.length - zugeordnet,
    groesster,
    doppelt: [...zaehler.entries()].filter(([, n]) => n > 1).map(([n]) => n),
  };
}

/* Bezeichnung eines Standorts: eigene Standnummer, sonst der Bezug auf
   die nächstgelegene, sonst als letzter Ausweg die laufende Nummer. */
function standortBezeichnung(s){
  if (!s) return null;
  if (s.nummer) return s.nummer;
  if (s.naheNummer) return "Nahe " + s.naheNummer;
  return "Standort " + s.nr;
}
function standortName(plan, nr){
  return standortBezeichnung((plan.standorte || []).find(x => x.nr === nr));
}

/* 10 · Suche                                                          */
/* ================================================================== */

const ZIEL_SPANNE = 40;   // so viele Zeichnungseinheiten füllen nach dem Sprung das Bild

/* Springt an eine Stelle im Plan und hebt sie hervor. */
function anspringen(punktAbsolut, wahl){
  if (!PLAN || !punktAbsolut) return;
  const r = groesseSetzen();
  sicht.m = Math.min(r.width, r.height) / ZIEL_SPANNE;
  vergroesserungBegrenzen();
  const n = PLAN.nullpunkt;
  sicht.x = r.width/2  - (punktAbsolut.x - n.x) * sicht.m;
  sicht.y = r.height/2 + (punktAbsolut.y - n.y) * sicht.m;
  hervorhebungWaehlen(wahl || null);
  zeichne();                 // groesseSetzen hat die Leinwand geleert
  pulsSetzen(punktAbsolut);
}

/* Je genauer der Treffer am Anfang steht, desto weiter oben. */
function trefferGuete(text, suche){
  const t = String(text || "").toLowerCase();
  if (t === suche) return 0;
  if (t.startsWith(suche)) return 1;
  return t.includes(suche) ? 2 : 99;
}

function suchen(roh){
  const q = String(roh || "").trim().toLowerCase();
  if (!q) return [];
  const treffer = [];

  for (const v of verteilerListe()){
    const g = trefferGuete(v.name, q);
    if (g < 99){
      const quelle = v.art === "mobil" && v.quelle && verteilerNach(v.quelle.uvId);
      treffer.push({
        guete: g, marke: v.art === "mobil" ? "MV" : "UV", uv:true,
        titel: v.name,
        unter: (v.art === "mobil" ? "Mobiler Verteiler" : "Verteiler") +
               (quelle ? " · hängt an " + quelle.name : "") +
               (hatOrt(v) ? "" : " · ohne Ort"),
        ziel: hatOrt(v) ? v : null,
        wahl: { art:"verteiler", uvId:v.id },
      });
    }
    for (const ab of (v.abgaenge || [])){
      const b = ab.verbraucher;
      if (!b) continue;
      const bez = b.standort ? (standortName(PLAN, b.standort) || "") : (b.standnummer || "");
      const name = b.name || "Verbraucher";
      const g = Math.min(trefferGuete(name, q), trefferGuete(bez, q));
      if (g === 99) continue;
      const nr = v.abgaenge.indexOf(ab) + 1;
      treffer.push({
        guete: g, marke: "V", titel: name,
        unter: [bez || "eigener Ort", v.name + " · Abg. " + nr,
                hatOrt(b) ? null : "ohne Ort"].filter(Boolean).join(" · "),
        ziel: hatOrt(b) ? b : (hatOrt(v) ? v : null),
        wahl: { art:"verbraucher", uvId:v.id, abgangId:ab.id },
      });
    }
  }

  const belegt = new Set();
  for (const v of verteilerListe())
    for (const ab of (v.abgaenge || []))
      if (ab.verbraucher && ab.verbraucher.standort) belegt.add(ab.verbraucher.standort);

  const n = PLAN.nullpunkt;
  for (const s of standorteAktiv(PLAN)){
    const bez = standortBezeichnung(s) || "";
    const g = trefferGuete(bez, q);
    if (g === 99 || belegt.has(s.nr)) continue;   // belegte stehen schon als Verbraucher drin
    treffer.push({
      guete: g + 0.5, marke: "ST", titel: bez,
      unter: "Standort, frei",
      ziel: { x: s.x + n.x, y: s.y + n.y },
      wahl: null,
    });
  }

  treffer.sort((a,b) => a.guete - b.guete || a.titel.localeCompare(b.titel, "de"));
  return treffer.slice(0, 60);
}

function sucheZeichnen(){
  const ziel = $("suchListe");
  const roh = $("suchEingabe").value;
  ziel.innerHTML = "";
  if (!roh.trim()){
    const p = document.createElement("div");
    p.className = "platzhalter";
    p.style.textAlign = "center";
    p.textContent = "Standnummer, Name eines Verteilers oder eines Verbrauchers eingeben.";
    ziel.appendChild(p);
    return;
  }
  const liste = suchen(roh);
  if (!liste.length){
    const p = document.createElement("div");
    p.className = "platzhalter";
    p.style.textAlign = "center";
    p.textContent = "Nichts gefunden.";
    ziel.appendChild(p);
    return;
  }
  for (const t of liste){
    const b = document.createElement("button");
    b.className = "zeile";
    b.innerHTML = '<span class="marke"></span>' +
                  '<span class="haupt"><span class="oben"></span><span class="unten"></span></span>' +
                  '<span class="pfeil">›</span>';
    const marke = b.querySelector(".marke");
    marke.textContent = t.marke;
    if (t.uv) marke.classList.add("uv");
    b.querySelector(".oben").textContent = t.titel;
    b.querySelector(".unten").textContent = t.unter;
    b.addEventListener("click", () => {
      sucheSchliessen();
      if (t.ziel) anspringen(t.ziel, t.wahl);
      else if (t.wahl) hervorhebungWaehlen(t.wahl);
    });
    ziel.appendChild(b);
  }
}
